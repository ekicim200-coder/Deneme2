/* =============================================================
   entities.js — Aktörler, yaratıklar, boss, mermiler, alan etkileri
   ============================================================= */

/* ---------------- Temel aktör ---------------- */
class Actor {
  constructor(cfg) {
    Object.assign(this, {
      id: U.uid(), x: 0, y: 0, r: 0.42, facing: 0, team: 'enemy',
      level: 1, element: 'su', name: '', size: 0.7, color: '#fff',
      dead: false, hp: 100, atkCd: 0, busy: 0, animTime: 0, hitFlash: 0,
      effects: [], vx: 0, vy: 0, knock: 0, deathTimer: 0,
      kind: 'monster', noHitTime: 0,
      swingT: 0, swingDur: 0, swingStep: 0, swingSpin: false
    }, cfg);
    this.stats = cfg.stats || StatSystem.empty();
    this.maxHp = this.stats.maxHp;
    if (cfg.hp === undefined) this.hp = this.maxHp;
  }

  /* Buff/debuff sonrası anlık statlar */
  eff() {
    const s = Object.assign({}, this.stats);
    for (const e of this.effects) {
      if (e.type === 'buff' && e.mods) {
        for (const [k, v] of Object.entries(e.mods)) {
          if (k === 'hpRegen') s[k] += v; else s[k] *= (1 + v);
        }
      }
      if (e.type === 'slow') s.moveSpeed *= (1 - e.val);
    }
    return s;
  }

  get stunned() { return this.effects.some(e => e.type === 'stun'); }
  get burning() { return this.effects.some(e => e.type === 'burn'); }
  get slowRatio() {
    let m = 1;
    for (const e of this.effects) if (e.type === 'slow') m *= (1 - e.val);
    return m;
  }

  addEffect(e) {
    if (e.type === 'stun' || e.type === 'slow' || e.type === 'burn') {
      const ex = this.effects.find(x => x.type === e.type);
      if (ex) { ex.dur = Math.max(ex.dur, e.dur); ex.val = Math.max(ex.val || 0, e.val || 0); return; }
    }
    this.effects.push(e);
  }

  update(dt, game) {
    this.animTime += dt;
    if (this.atkCd > 0) this.atkCd -= dt;
    if (this.busy > 0) this.busy -= dt;
    if (this.swingT > 0) this.swingT -= dt;
    if (this.hitFlash > 0) this.hitFlash -= dt;

    // efekt süreleri + yanma hasarı
    for (let i = this.effects.length - 1; i >= 0; i--) {
      const e = this.effects[i];
      e.dur -= dt;
      if (e.type === 'burn') {
        e.acc = (e.acc || 0) + dt;
        if (e.acc >= 0.5) {
          e.acc -= 0.5;
          const d = Math.max(1, Math.round(e.dps * 0.5));
          this.hp -= d;
          game.fx.damageNumber(this.x, this.y, d, { burn: true });
          if (this.hp <= 0) game.onDeath(this, e.source || null);
        }
      }
      if (e.dur <= 0) this.effects.splice(i, 1);
    }

    // HP yenilenmesi
    this.noHitTime += dt;
    if (!this.dead && this.hp > 0) {
      const s = this.eff();
      const R = GameData.BALANCE.regen;
      let heal = (s.hpRegen || 0) * dt;               // ekipmandan gelen düz yenilenme

      // Oransal yenilenme (Metin2 mantığı): savaş dışında hızlı, savaşta düşük
      let rate = 0;
      if (this.kind === 'boss')        rate = this.inCombat ? R.bossCombat : R.bossIdle;
      else if (this.kind === 'monster') rate = this.inCombat ? R.monsterCombat : R.monsterIdle;
      else if (this.kind === 'player' && this.noHitTime >= R.idleDelay) {
        rate = R.playerIdle * (this.race === 'su' ? GameData.RACES.su.passive.regenMul : 1);
      }
      if (rate > 0 && !this.burning) heal += this.maxHp * rate * dt;
      if (heal > 0) this.hp = Math.min(this.maxHp, this.hp + heal);
    }

    // geri tepme
    if (this.knock > 0) {
      this.x += this.vx * dt; this.y += this.vy * dt;
      this.knock -= dt;
      game.world.clampPos(this);
    }
  }

  moveTowards(tx, ty, dt, game, speedMul = 1) {
    const s = this.eff();
    const spd = s.moveSpeed * speedMul;
    const d = U.dist(this.x, this.y, tx, ty);
    if (d < 0.02) return;
    const nx = (tx - this.x) / d, ny = (ty - this.y) / d;
    this.tryMove(nx * spd * dt, ny * spd * dt, game);
    this.facing = Math.atan2(ny, nx);
  }

  tryMove(dx, dy, game) {
    const w = game.world;
    const okX = !w.blocked(this.x + dx, this.y, this.r);
    const okY = !w.blocked(this.x, this.y + dy, this.r);
    if (okX) this.x += dx;
    if (okY) this.y += dy;

    // Her iki eksen de kapalıysa engelin etrafından teğet yönde kay.
    // (Aksi halde aktör engele dayanıp sonsuza dek takılı kalır.)
    if (!okX && !okY && (dx || dy)) {
      const len = Math.hypot(dx, dy);
      const ux = dx / len, uy = dy / len;
      if (this.slideSide === undefined) this.slideSide = 1;
      for (const s of [this.slideSide, -this.slideSide]) {
        // önce 45°, sonra tam 90° kayma dene
        const cands = [
          [(ux - uy * s) * 0.7071 * len, (uy + ux * s) * 0.7071 * len],
          [-uy * s * len, ux * s * len]
        ];
        let moved = false;
        for (const [cx, cy] of cands) {
          if (!w.blocked(this.x + cx, this.y + cy, this.r)) {
            this.x += cx; this.y += cy; this.slideSide = s; moved = true; break;
          }
        }
        if (moved) break;
      }
    }
    w.clampPos(this);
  }

  distTo(o) { return U.dist(this.x, this.y, o.x, o.y); }
}

/* ---------------- Oyuncu ---------------- */
class PlayerActor extends Actor {
  constructor(save, game) {
    const stats = StatSystem.compute(save);
    super({
      x: 15, y: 15, team: 'player', name: save.name,
      element: save.race, level: save.level, stats,
      color: GameData.RACES[save.race].colors.primary,
      size: 0.8, r: 0.4, kind: 'player'
    });
    this.save = save;
    this.cls = save.cls;
    this.race = save.race;
    this.mana = GameData.BALANCE.manaMax;
    this.skillCd = [0, 0, 0, 0];
    this.dashCd = 0;
    this.potionCd = 0;
    this.dashTime = 0;
    this.dashDir = { x: 0, y: 0 };
    this.combo = 0;          // 0,1,2 → üçüncü vuruş bitirici
    this.comboTimer = 0;
    this.potionCds = { kucuk: 0, buyuk: 0, mana: 0 };
    this.skillLv = save.skillLv || [1, 1, 1, 1];
    this.hp = this.maxHp;
  }

  refreshStats() {
    this.stats = StatSystem.compute(this.save);
    const ratio = this.maxHp > 0 ? this.hp / this.maxHp : 1;
    this.maxHp = this.stats.maxHp;
    this.hp = Math.min(this.maxHp, this.maxHp * ratio);
    this.level = this.save.level;
    this.element = this.save.race;
    this.skillLv = this.save.skillLv;         // yetenek seviyeleri
  }

  update(dt, game) {
    super.update(dt, game);
    const B = GameData.BALANCE;
    this.mana = Math.min(B.manaMax, this.mana + B.manaRegen * dt);
    for (let i = 0; i < 4; i++) if (this.skillCd[i] > 0) this.skillCd[i] -= dt;
    if (this.dashCd > 0) this.dashCd -= dt;
    if (this.potionCd > 0) this.potionCd -= dt;

    if (this.comboTimer > 0) { this.comboTimer -= dt; if (this.comboTimer <= 0) this.combo = 0; }
    for (const k in this.potionCds) if (this.potionCds[k] > 0) this.potionCds[k] -= dt;

    if (this.dashTime > 0) {
      this.dashTime -= dt;
      const spd = 14;
      this.tryMove(this.dashDir.x * spd * dt, this.dashDir.y * spd * dt, game);
      game.fx.trail(this.x, this.y, GameData.RACES[this.race].colors.aura);
    }
  }
}

/* ---------------- MADEN TAŞI (Metin2 mantığı) ----------------
   Hareket etmez, saldırmaz. Vurdukça can barı iner ve belirli eşiklerde
   içinden düşman dalgası çıkar. Kırılınca ganimet + XP verir. */
class OreNode extends Actor {
  /* hpOverride: oyuncunun anlık gücüne göre hesaplanan can (kazma süresi sabit kalsın diye) */
  constructor(def, level, game, pos, element, hpOverride) {
    const mul = 1 + (level - 1) * 0.09;
    super({
      x: pos.x, y: pos.y, team: 'enemy', name: def.name, level,
      element, kind: 'stone', size: def.size, r: def.size * 0.8,
      color: element === 'ates' ? '#ff7a2f' : '#4fd6ff',
      stats: Object.assign(StatSystem.empty(), {
        maxHp: Math.max(Math.round(def.hp * mul), Math.round(hpOverride || 0)),
        defense: Math.round(def.def * mul),
        attack: 0, magic: 0, moveSpeed: 0, attackSpeed: 0, range: 0
      })
    });
    this.def = def;
    this.tier = 'stone';
    this.wavesLeft = def.waves;
    this.nextWaveAt = 1 - 1 / (def.waves + 1);   // ilk dalga eşiği (HP oranı)
    this.spawned = 0;
    this.pulse = U.rand(0, 6.28);
  }

  /* Taş yerinde durur; yalnızca dalga kontrolü yapar */
  update(dt, game) {
    this.animTime += dt;
    if (this.hitFlash > 0) this.hitFlash -= dt;
    if (this.dead) return;

    const ratio = this.hp / this.maxHp;
    while (this.wavesLeft > 0 && ratio <= this.nextWaveAt) {
      this.releaseWave(game);
      this.wavesLeft--;
      this.nextWaveAt -= 1 / (this.def.waves + 1);
    }
  }

  /* İçinden düşman dalgası çıkar */
  releaseWave(game) {
    const n = this.def.perWave;
    for (let i = 0; i < n; i++) {
      const a = U.rand(0, Math.PI * 2);
      const pos = game.world.openNear(
        this.x + Math.cos(a) * (this.r + 1.6),
        this.y + Math.sin(a) * (this.r + 1.6), 0.5);
      const m = game.spawnMonster(pos, this.element, this.level);
      if (m) { m.state = 'chase'; m.aggroRange = 22; m.leash = 26; this.spawned++; }
    }
    game.fx.ring(this.x, this.y, this.r * 2.2, this.color);
    UI.toast(`${this.name} sarsıldı — ${n} düşman çıktı!`, 'warn');
  }
}

/* ---------------- Yaratık ---------------- */
class Monster extends Actor {
  constructor(def, level, game, pos, ageMul = 1) {
    const stats = Combat.monsterStats(def, level, ageMul);
    super({
      x: pos.x, y: pos.y, team: 'enemy', name: def.name, level,
      element: def.element, stats, color: def.color, size: def.size,
      r: def.size * 0.55, kind: def.tier === 'boss' ? 'boss' : 'monster'
    });
    this.def = def;
    this.tier = def.tier;
    this.ranged = !!def.ranged;
    this.spawn = { x: pos.x, y: pos.y };
    this.state = 'idle';
    this.wanderT = U.rand(0, 2);
    this.wanderTo = { x: pos.x, y: pos.y };
    this.aggroRange = def.tier === 'boss' ? 99 : 8.5;
    this.leash = 16;
  }

  update(dt, game) {
    super.update(dt, game);
    if (this.dead || this.stunned) return;
    const p = game.player;
    if (!p || p.dead) { this.state = 'idle'; }

    const s = this.eff();
    const d = p ? this.distTo(p) : 999;

    if (p && !p.dead && d < this.aggroRange) this.state = 'chase';
    else if (this.state === 'chase' && (d > this.leash || !p || p.dead)) this.state = 'idle';
    this.inCombat = (this.state === 'chase');

    if (this.state === 'chase' && p) {
      const wantRange = this.ranged ? s.range * 0.8 : s.range * 0.75;
      if (d > wantRange) this.moveTowards(p.x, p.y, dt, game);
      else if (d < wantRange * 0.55 && this.ranged) {
        this.moveTowards(p.x * 2 - this.x, p.y * 2 - this.y, dt, game, -0.7);
      } else {
        this.facing = U.angle(this.x, this.y, p.x, p.y);
      }
      if (d <= s.range + p.r && this.atkCd <= 0) this.attack(game, p);
    } else {
      this.wanderT -= dt;
      if (this.wanderT <= 0) {
        this.wanderT = U.rand(2.5, 5);
        this.wanderTo = {
          x: this.spawn.x + U.rand(-3, 3),
          y: this.spawn.y + U.rand(-3, 3)
        };
      }
      if (U.dist(this.x, this.y, this.wanderTo.x, this.wanderTo.y) > 0.4) {
        this.moveTowards(this.wanderTo.x, this.wanderTo.y, dt, game, 0.45);
      }
    }
  }

  attack(game, target) {
    const s = this.eff();
    this.atkCd = 1 / Math.max(0.2, s.attackSpeed);
    this.busy = 0.28;
    this.facing = U.angle(this.x, this.y, target.x, target.y);
    if (this.ranged) {
      game.spawnProjectile({
        owner: this, x: this.x, y: this.y, angle: this.facing,
        speed: 9, life: 1.4, mult: 1, color: this.color, size: 0.22
      });
    } else {
      game.dealDamage(this, target, { mult: 1 });
      game.fx.hit(target.x, target.y, this.color);
    }
  }
}

/* ---------------- Boss ---------------- */
class Boss extends Monster {
  constructor(def, level, game, pos, ageMul = 1) {
    super({ ...def, tier: 'boss' }, level, game, pos, ageMul);
    this.bossDef = def;
    this.phaseIdx = 0;
    this.specialCd = 4;
    this.phaseFlash = 0;
  }

  get phase() { return this.bossDef.phases[this.phaseIdx]; }

  update(dt, game) {
    // faz geçişi
    const ratio = this.hp / this.maxHp;
    for (let i = this.bossDef.phases.length - 1; i >= 0; i--) {
      if (ratio <= this.bossDef.phases[i].at && i > this.phaseIdx) {
        this.phaseIdx = i;
        this.phaseFlash = 1.2;
        this.specialCd = 1.5;
        game.fx.ring(this.x, this.y, this.color, 5);
        UI.toast(`${this.name} — ${this.phase.name}`, 'warn');
        break;
      }
    }
    if (this.phaseFlash > 0) this.phaseFlash -= dt;

    super.update(dt, game);
    if (this.dead || this.stunned) return;

    this.specialCd -= dt;
    const p = game.player;
    if (p && !p.dead && this.specialCd <= 0 && this.distTo(p) < 14) {
      this.specialCd = this.phase.specialCd;
      const kind = this.phase.special;
      if (kind === 'nova' || (kind === 'both' && U.chance(0.5))) this.nova(game);
      else this.volley(game, p);
    }
  }

  nova(game) {
    this.busy = 0.5;
    game.fx.ring(this.x, this.y, this.color, 6);
    const n = 14;
    for (let i = 0; i < n; i++) {
      game.spawnProjectile({
        owner: this, x: this.x, y: this.y, angle: (i / n) * Math.PI * 2,
        speed: 7.5, life: 2.0, mult: 0.85 * this.phase.atkMul,
        color: this.color, size: 0.3
      });
    }
  }

  volley(game, target) {
    this.busy = 0.5;
    const base = U.angle(this.x, this.y, target.x, target.y);
    for (let i = -2; i <= 2; i++) {
      game.spawnProjectile({
        owner: this, x: this.x, y: this.y, angle: base + i * 0.22,
        speed: 11, life: 1.6, mult: 0.9 * this.phase.atkMul,
        color: this.color, size: 0.28
      });
    }
  }

  attack(game, target) {
    const s = this.eff();
    this.atkCd = 1 / Math.max(0.2, s.attackSpeed * this.phase.spdMul);
    this.busy = 0.35;
    this.facing = U.angle(this.x, this.y, target.x, target.y);
    game.dealDamage(this, target, { mult: 1.1 * this.phase.atkMul });
    game.fx.hit(target.x, target.y, this.color);
  }
}

/* ---------------- PvP Rakip Botu ---------------- */
class BotActor extends Actor {
  constructor(profile, game) {
    super({
      x: profile.x, y: profile.y, team: 'enemy', name: profile.name,
      level: profile.level, element: profile.race, stats: profile.stats,
      color: GameData.RACES[profile.race].colors.primary, size: 0.8, r: 0.4, kind: 'player'
    });
    this.cls = profile.cls;
    this.race = profile.race;
    this.skillCd = [U.rand(1, 3), U.rand(2, 4), U.rand(3, 6), U.rand(5, 9)];
    this.think = 0;
    this.strafe = U.chance(0.5) ? 1 : -1;
    this.mana = GameData.BALANCE.manaMax;
  }

  update(dt, game) {
    super.update(dt, game);
    if (this.dead || this.stunned) return;
    const p = game.player;
    if (!p || p.dead) return;

    const s = this.eff();
    this.mana = Math.min(100, this.mana + GameData.BALANCE.manaRegen * dt);
    for (let i = 0; i < 4; i++) if (this.skillCd[i] > 0) this.skillCd[i] -= dt;

    const d = this.distTo(p);
    const want = s.range * 0.8;

    this.think -= dt;
    if (this.think <= 0) { this.think = U.rand(0.8, 1.8); this.strafe *= U.chance(0.4) ? -1 : 1; }

    if (d > want) {
      this.moveTowards(p.x, p.y, dt, game, 1);
    } else if (d < want * 0.55 && s.range > 3) {
      this.moveTowards(p.x * 2 - this.x, p.y * 2 - this.y, dt, game, -0.85);
    } else {
      // yan hareket
      const a = U.angle(this.x, this.y, p.x, p.y) + Math.PI / 2 * this.strafe;
      this.tryMove(Math.cos(a) * s.moveSpeed * 0.6 * dt, Math.sin(a) * s.moveSpeed * 0.6 * dt, game);
      this.facing = U.angle(this.x, this.y, p.x, p.y);
    }

    // yetenek kullan
    const skills = GameData.CLASSES[this.cls].skills;
    for (let i = 3; i >= 0; i--) {
      const sk = GameData.SKILLS[skills[i]];
      if (this.skillCd[i] <= 0 && this.mana >= sk.mana) {
        const reach = sk.castRange || (sk.type === 'melee' || sk.type === 'area' ? sk.radius || 3 : 9);
        if (sk.type === 'buff' || d <= reach + 1) {
          this.mana -= sk.mana;
          this.skillCd[i] = sk.cd;
          Skills.cast(this, i, game, { x: p.x, y: p.y });
          this.busy = 0.35;
          return;
        }
      }
    }

    if (d <= s.range + p.r && this.atkCd <= 0) {
      this.atkCd = 1 / Math.max(0.2, s.attackSpeed);
      this.busy = 0.25;
      this.facing = U.angle(this.x, this.y, p.x, p.y);
      if (s.range > 3) {
        game.spawnProjectile({
          owner: this, x: this.x, y: this.y, angle: this.facing,
          speed: 14, life: 1.1, mult: 1, color: this.color, size: 0.2,
          magic: this.cls === 'buyucu'
        });
      } else {
        game.meleeSwing(this, { mult: 1, radius: s.range + 0.6, arc: 1.4 });
      }
    }
  }
}

/* ---------------- Mermi ---------------- */
class Projectile {
  constructor(cfg) {
    Object.assign(this, {
      id: U.uid(), x: 0, y: 0, angle: 0, speed: 10, life: 1.2,
      mult: 1, color: '#fff', size: 0.22, pierce: 0, splash: 0,
      magic: false, bonusPen: 0, forceCrit: false, effect: null, hitIds: []
    }, cfg);
    this.vx = Math.cos(this.angle) * this.speed;
    this.vy = Math.sin(this.angle) * this.speed;
    this.dead = false;
  }

  update(dt, game) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.life -= dt;
    if (this.life <= 0) { this.dead = true; return; }

    // ÖNCE hedef kontrolü: aksi halde maden taşı gibi engel oluşturan hedeflere
    // mermi, aktöre değmeden engelde patlıyordu.
    const targets = game.actors.filter(a => !a.dead && a.team !== this.owner.team);
    for (const t of targets) {
      if (this.hitIds.includes(t.id)) continue;
      if (U.dist(this.x, this.y, t.x, t.y) <= t.r + this.size) {
        this.hitIds.push(t.id);
        game.dealDamage(this.owner, t, {
          mult: this.mult, magic: this.magic, bonusPen: this.bonusPen,
          forceCrit: this.forceCrit, effect: this.effect
        });
        game.fx.hit(t.x, t.y, this.color);
        if (this.splash > 0) { this.onImpact(game); return; }
        if (this.pierce > 0) this.pierce--;
        else { this.dead = true; return; }
      }
    }

    // duvar/kaya çarpışması (maden taşı engeli mermiyi durdurmaz — hedefi taşın kendisi)
    if (game.world.blocked(this.x, this.y, 0.1, 'ore')) { this.onImpact(game); return; }
  }

  onImpact(game) {
    this.dead = true;
    if (this.splash > 0) {
      game.fx.ring(this.x, this.y, this.color, this.splash);
      const targets = game.actors.filter(a => !a.dead && a.team !== this.owner.team);
      for (const t of targets) {
        if (this.hitIds.includes(t.id)) continue;
        if (U.dist(this.x, this.y, t.x, t.y) <= this.splash + t.r) {
          game.dealDamage(this.owner, t, {
            mult: this.mult * 0.7, magic: this.magic, effect: this.effect
          });
        }
      }
    }
  }
}

/* ---------------- Alan etkisi ---------------- */
class AreaEffect {
  constructor(cfg) {
    Object.assign(this, {
      id: U.uid(), x: 0, y: 0, radius: 3, hits: 1, tick: 0.4,
      mult: 1, magic: false, color: '#fff', effect: null, follow: null,
      elapsed: 0, done: 0, dead: false, life: 0
    }, cfg);
    this.life = this.tick * this.hits + 0.25;
  }

  update(dt, game) {
    if (this.follow && !this.follow.dead) { this.x = this.follow.x; this.y = this.follow.y; }
    this.elapsed += dt;
    this.life -= dt;
    if (this.done < this.hits && this.elapsed >= this.done * this.tick) {
      this.done++;
      game.fx.ring(this.x, this.y, this.color, this.radius);
      const targets = game.actors.filter(a => !a.dead && a.team !== this.owner.team);
      for (const t of targets) {
        if (U.dist(this.x, this.y, t.x, t.y) <= this.radius + t.r) {
          game.dealDamage(this.owner, t, { mult: this.mult, magic: this.magic, effect: this.effect });
        }
      }
    }
    if (this.life <= 0) this.dead = true;
  }
}

/* =============================================================
   world.js — Harita üretimi, engeller, portallar, NPC'ler, çarpışma
   ============================================================= */

class World {
  constructor(mapId, game) {
    this.id = mapId;
    this.def = GameData.MAPS[mapId];
    this.w = this.def.w;
    this.h = this.def.h;
    this.obstacles = [];   // {x,y,r,kind,color,height}
    this.portals = [];     // {x,y,r,to,label,color}
    this.npcs = [];        // {x,y,r,kind,name}
    this.tiles = [];       // görsel varyasyon
    this.game = game;

    /* Maden haritasının elementi HER ZAMAN oyuncunun karşıtıdır:
       Su karakteri → ateş madenleri ve ateş düşmanları, Ateş karakteri → su madenleri. */
    if (this.def.mine) {
      const race = (game && game.save && game.save.race) || 'su';
      this.element = race === 'su' ? 'ates' : 'su';
      this.name = this.element === 'ates' ? 'Ateş Madenleri' : 'Buz Madenleri';
      this.accent = this.element === 'ates' ? '#8a4a2a' : '#3f7f9a';
      this.ground = this.element === 'ates' ? '#2e2028' : '#1e2833';
    } else {
      this.element = this.def.element || null;
      this.name = this.def.name;
      this.accent = this.def.accent;
      this.ground = this.def.ground;
    }
    this.oreSpots = [];
    this.build();
    this.makeTiles();
  }

  makeTiles() {
    for (let y = 0; y < this.h; y++) {
      const row = [];
      for (let x = 0; x < this.w; x++) row.push(Math.random());
      this.tiles.push(row);
    }
  }

  addRock(x, y, r, color, height, kind = 'rock') {
    this.obstacles.push({ x, y, r, color, height, kind });
  }

  build() {
    const d = this.def;
    const cx = this.w / 2, cy = this.h / 2;

    if (d.safe) {
      // ---- ŞEHİR ----
      const bld = (x, y, w, h, color, name) => {
        this.obstacles.push({ x, y, r: Math.max(w, h) * 0.5, bw: w, bh: h, color, height: 2.2, kind: 'building', name });
      };
      bld(cx - 7, cy - 6, 3.2, 3.2, '#5a4f43', 'Market');
      bld(cx + 5, cy - 7, 3.0, 3.0, '#4a4a55', 'Demirci');
      bld(cx - 8, cy + 5, 2.8, 2.8, '#4d5a4a', 'Görev Salonu');
      bld(cx + 7, cy + 6, 2.8, 2.8, '#55495a', 'Depo');

      // dekor sütunlar
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        this.addRock(cx + Math.cos(a) * 11, cy + Math.sin(a) * 11, 0.5, '#6b7285', 1.6, 'pillar');
      }

      this.npcs.push({ x: cx - 7, y: cy - 3.4, r: 1.3, kind: 'market', name: 'Tüccar Vela' });
      this.npcs.push({ x: cx + 5, y: cy - 4.4, r: 1.3, kind: 'craft', name: 'Demirci Kadir' });
      this.npcs.push({ x: cx - 8, y: cy + 7.4, r: 1.3, kind: 'quest', name: 'Görev Ustası Arin' });
      this.npcs.push({ x: cx + 7, y: cy + 8.4, r: 1.3, kind: 'storage', name: 'Depocu Nuran' });

      this.portals.push({ x: cx - 11, y: cy - 11, r: 1.4, to: 'farm_su', label: 'Buz Vadisi', color: '#4fd6ff' });
      this.portals.push({ x: cx + 11, y: cy - 11, r: 1.4, to: 'farm_ates', label: 'Lav Çölü', color: '#ff7a2f' });
      this.portals.push({ x: cx - 11, y: cy + 11, r: 1.4, to: 'boss_su', label: 'Kraken İni', color: '#2f9fd0' });
      this.portals.push({ x: cx + 11, y: cy + 11, r: 1.4, to: 'boss_ates', label: 'Ejderha Yuvası', color: '#e05a2a' });
      this.portals.push({ x: cx, y: cy + 12, r: 1.6, to: 'arena', label: 'PvP Arenası', color: '#ffd15c' });
      const foe = ((this.game && this.game.save && this.game.save.race) === 'su') ? 'ates' : 'su';
      this.portals.push({
        x: cx, y: cy - 12, r: 1.6, to: 'maden',
        label: foe === 'ates' ? 'Ateş Madenleri' : 'Buz Madenleri',
        color: foe === 'ates' ? '#ff7a2f' : '#4fd6ff'
      });

    } else if (d.pvp) {
      // ---- ARENA (simetrik) ----
      for (let i = 0; i < 4; i++) {
        const ox = i % 2 === 0 ? -5 : 5;
        const oy = i < 2 ? -5 : 5;
        this.addRock(cx + ox, cy + oy, 0.9, '#7a7f95', 2.0, 'pillar');
      }
      this.addRock(cx, cy - 8, 1.1, '#8a90a8', 1.6, 'pillar');
      this.addRock(cx, cy + 8, 1.1, '#8a90a8', 1.6, 'pillar');
      for (let i = 0; i < 18; i++) {
        const a = (i / 18) * Math.PI * 2;
        this.addRock(cx + Math.cos(a) * 12.5, cy + Math.sin(a) * 12.5, 0.7, '#5b6076', 1.8, 'pillar');
      }
      this.portals.push({ x: cx, y: cy + 11.5, r: 1.4, to: 'city', label: 'Şehre Dön', color: '#9fe0a0' });

    } else {
      // ---- FARM / BOSS HARİTALARI ----
      const count = d.boss ? 14 : d.mine ? 30 : 46;
      const accent = this.accent;
      for (let i = 0; i < count; i++) {
        const x = U.rand(3, this.w - 3), y = U.rand(3, this.h - 3);
        if (U.dist(x, y, 4, 4) < 6) continue;                 // giriş bölgesi boş
        if (d.boss && U.dist(x, y, cx, cy) < 8) continue;      // boss alanı boş
        this.addRock(x, y, U.rand(0.5, 1.1), accent, U.rand(0.8, 2.0), U.chance(0.5) ? 'rock' : 'tree');
      }
      this.portals.push({ x: 3.5, y: 3.5, r: 1.5, to: 'city', label: 'Şehre Dön', color: '#9fe0a0' });

      /* Maden taşlarının duracağı boş noktalar */
      if (d.mine) {
        for (let i = 0; i < (d.ore || 6); i++) {
          const a = (i / (d.ore || 6)) * Math.PI * 2 + U.rand(-0.25, 0.25);
          const rad = U.rand(9, Math.min(this.w, this.h) * 0.42);
          const p = this.openNear(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, 1.9);
          if (U.dist(p.x, p.y, 4, 4) < 8) continue;
          this.oreSpots.push(p);
        }
      }
    }
  }

  /* Çarpışma testi */
  blocked(x, y, r, ignoreKind) {
    if (x < r + 1 || y < r + 1 || x > this.w - r - 1 || y > this.h - r - 1) return true;
    for (const o of this.obstacles) {
      if (ignoreKind && o.kind === ignoreKind) continue;
      if (o.kind === 'building') {
        const hw = o.bw / 2 + r, hh = o.bh / 2 + r;
        if (Math.abs(x - o.x) < hw && Math.abs(y - o.y) < hh) return true;
      } else if (U.dist2(x, y, o.x, o.y) < (o.r + r) * (o.r + r)) return true;
    }
    return false;
  }

  clampPos(a) {
    a.x = U.clamp(a.x, a.r + 1, this.w - a.r - 1);
    a.y = U.clamp(a.y, a.r + 1, this.h - a.r - 1);
  }

  randomOpenPos(minDistFrom, minDist = 8) {
    for (let i = 0; i < 200; i++) {
      const x = U.rand(3, this.w - 3), y = U.rand(3, this.h - 3);
      if (this.blocked(x, y, 0.6)) continue;
      if (minDistFrom && U.dist(x, y, minDistFrom.x, minDistFrom.y) < minDist) continue;
      return { x, y };
    }
    return { x: this.w / 2, y: this.h / 2 };
  }

  /* Verilen noktaya en yakın boş konum (engel içine doğma sorununu önler) */
  openNear(x, y, radius = 0.5) {
    if (!this.blocked(x, y, radius)) return { x, y };
    for (let r = 0.6; r < 10; r += 0.5) {
      for (let a = 0; a < Math.PI * 2; a += Math.PI / 10) {
        const nx = x + Math.cos(a) * r, ny = y + Math.sin(a) * r;
        if (!this.blocked(nx, ny, radius)) return { x: nx, y: ny };
      }
    }
    return { x: this.w / 2, y: this.h / 2 };
  }

  entryPos() {
    let p;
    if (this.def.safe) p = { x: this.w / 2, y: this.h / 2 + 4 };
    else if (this.def.pvp) p = { x: this.w / 2, y: this.h / 2 + 9.5 };
    else p = { x: 5.5, y: 5.5 };
    return this.openNear(p.x, p.y, 0.5);
  }
}

/* =============================================================
   render.js — 2.5D izometrik çizim + görsel efektler
   Tüm çizim canvas üzerinde; asset yok, her şey vektörel.
   ============================================================= */

const TW = 64, TH = 32; // izometrik karo genişlik/yükseklik

class Fx {
  constructor() { this.parts = []; this.numbers = []; this.rings = []; this.arcs = []; this.swings = []; }

  hit(x, y, color) {
    for (let i = 0; i < 7; i++) {
      const a = U.rand(0, Math.PI * 2);
      this.parts.push({ x, y, z: U.rand(0.3, 1.0), vx: Math.cos(a) * U.rand(1, 4), vy: Math.sin(a) * U.rand(1, 4), vz: U.rand(1, 4), life: U.rand(0.25, 0.5), max: 0.5, color, size: U.rand(2, 4) });
    }
  }
  trail(x, y, color) {
    this.parts.push({ x, y, z: 0.4, vx: 0, vy: 0, vz: 0.6, life: 0.35, max: 0.35, color, size: 5 });
  }
  ring(x, y, color, radius) { this.rings.push({ x, y, color, r: 0.2, max: radius, life: 0.45, total: 0.45 }); }
  arc(x, y, angle, radius, color) { this.arcs.push({ x, y, angle, radius, color, life: 0.22, total: 0.22 }); }

  /* Savaşçı kombosu: yay boyunca süpüren kılıç izi.
     step 0 → sağdan sola, step 1 → soldan sağa, step 2 → 360° dönüş (bitirici) */
  swing(x, y, angle, radius, color, step = 0, spin = false) {
    const arcs = spin
      ? { from: -Math.PI, to: Math.PI, dur: 0.34, width: 11 }
      : step === 1
        ? { from: 1.15, to: -0.75, dur: 0.20, width: 8 }
        : { from: -1.15, to: 0.75, dur: 0.22, width: 8 };
    this.swings.push({
      x, y, angle, radius, color, spin,
      from: arcs.from, to: arcs.to, width: arcs.width,
      life: arcs.dur, total: arcs.dur
    });
  }
  damageNumber(x, y, value, opt = {}) {
    this.numbers.push({ x, y, value, life: 1.0, vy: -1.4, crit: !!opt.crit, heal: !!opt.heal, burn: !!opt.burn, pen: !!opt.pen, xp: !!opt.xp, mana: !!opt.mana });
  }
  levelUp(x, y) {
    for (let i = 0; i < 30; i++) {
      const a = U.rand(0, Math.PI * 2);
      this.parts.push({ x, y, z: 0.2, vx: Math.cos(a) * U.rand(0.5, 2.5), vy: Math.sin(a) * U.rand(0.5, 2.5), vz: U.rand(3, 7), life: 1.1, max: 1.1, color: '#ffd15c', size: U.rand(2, 5) });
    }
  }

  update(dt) {
    for (let i = this.swings.length - 1; i >= 0; i--) {
      this.swings[i].life -= dt;
      if (this.swings[i].life <= 0) this.swings.splice(i, 1);
    }
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.vz -= 6 * dt;
      p.life -= dt; if (p.life <= 0) this.parts.splice(i, 1);
    }
    for (let i = this.numbers.length - 1; i >= 0; i--) {
      const n = this.numbers[i];
      n.y += n.vy * dt * 0.35; n.life -= dt;
      if (n.life <= 0) this.numbers.splice(i, 1);
    }
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const r = this.rings[i];
      r.life -= dt; r.r = U.lerp(0.2, r.max, 1 - r.life / r.total);
      if (r.life <= 0) this.rings.splice(i, 1);
    }
    for (let i = this.arcs.length - 1; i >= 0; i--) {
      this.arcs[i].life -= dt;
      if (this.arcs[i].life <= 0) this.arcs.splice(i, 1);
    }
  }
}

class Renderer {
  constructor(canvas, game) {
    this.cv = canvas;
    this.ctx = canvas.getContext('2d');
    this.game = game;
    this.cam = { x: 15, y: 15, zoom: 1 };
    this.shakeAmt = 0; this.shakeT = 0; this.sx = 0; this.sy = 0;   // vuruş sarsıntısı
    this.mini = document.getElementById('minimap');
    this.mctx = this.mini ? this.mini.getContext('2d') : null;
    this.resize();
    window.addEventListener('resize', () => this.resize());
  }

  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.cv.width = this.cv.clientWidth * dpr;
    this.cv.height = this.cv.clientHeight * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.vw = this.cv.clientWidth;
    this.vh = this.cv.clientHeight;
    /* Zum: masaüstünde geniş görüş, dokunmatikte karakter okunaklı kalsın */
    const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    this.cam.zoom = coarse
      ? U.clamp(Math.min(this.vw / 620, this.vh / 430), 0.72, 1.25)
      : U.clamp(Math.min(this.vw / 900, this.vh / 560), 0.62, 1.35);
    // mini haritayı da ekrana göre ölçekle
    if (this.mini) {
      const box = this.mini.clientWidth || 150;
      if (this.mini.width !== box) { this.mini.width = box; this.mini.height = box; }
    }
  }

  iso(x, y) {
    return { x: (x - y) * (TW / 2), y: (x + y) * (TH / 2) };
  }

  /* Ekran sarsıntısı — bitirici vuruşta darbe hissi */
  shake(amount) { this.shakeAmt = Math.max(this.shakeAmt, amount); this.shakeT = 0.18; }

  shakeOffset() {
    if (this.shakeT <= 0 || this.shakeAmt <= 0) return { x: 0, y: 0 };
    const k = this.shakeAmt * (this.shakeT / 0.18);
    return { x: (Math.random() - 0.5) * k, y: (Math.random() - 0.5) * k };
  }

  worldToScreen(x, y) {
    const i = this.iso(x, y), c = this.iso(this.cam.x, this.cam.y);
    return {
      x: (i.x - c.x) * this.cam.zoom + this.vw / 2 + this.sx,
      y: (i.y - c.y) * this.cam.zoom + this.vh / 2 + this.sy
    };
  }

  screenToWorld(sx, sy) {
    const c = this.iso(this.cam.x, this.cam.y);
    const ix = (sx - this.vw / 2) / this.cam.zoom + c.x;
    const iy = (sy - this.vh / 2) / this.cam.zoom + c.y;
    return {
      x: (ix / (TW / 2) + iy / (TH / 2)) / 2,
      y: (iy / (TH / 2) - ix / (TW / 2)) / 2
    };
  }

  follow(target, dt) {
    if (this.shakeT > 0) { this.shakeT -= dt; if (this.shakeT <= 0) this.shakeAmt = 0; }
    this.cam.x = U.lerp(this.cam.x, target.x, Math.min(1, dt * 6));
    this.cam.y = U.lerp(this.cam.y, target.y, Math.min(1, dt * 6));
  }

  /* ---------------- Ana çizim ---------------- */
  draw() {
    const g = this.game, ctx = this.ctx, w = g.world;
    const so = this.shakeOffset(); this.sx = so.x; this.sy = so.y;
    ctx.clearRect(0, 0, this.vw, this.vh);

    // arka plan gradyanı
    const bg = ctx.createLinearGradient(0, 0, 0, this.vh);
    bg.addColorStop(0, '#080b14');
    bg.addColorStop(1, '#10141f');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, this.vw, this.vh);

    this.drawGround(w);

    // derinlik sıralı nesneler
    const items = [];
    for (const o of w.obstacles) { if (o.kind !== 'ore') items.push({ d: o.x + o.y, kind: 'obs', o }); }
    for (const p of w.portals) items.push({ d: p.x + p.y - 0.1, kind: 'portal', o: p });
    for (const n of w.npcs) items.push({ d: n.x + n.y, kind: 'npc', o: n });
    for (const a of g.actors) if (!a.removed) items.push({ d: a.x + a.y, kind: 'actor', o: a });
    for (const p of g.projectiles) items.push({ d: p.x + p.y + 0.5, kind: 'proj', o: p });
    items.sort((a, b) => a.d - b.d);

    // zemin üstü efektler (alan büyüleri, halkalar)
    for (const a of g.areas) this.drawAreaMarker(a);
    for (const r of g.fx.rings) this.drawRing(r);
    for (const a of g.fx.arcs) this.drawArc(a);
    for (const sw of g.fx.swings) this.drawSwing(sw);

    for (const it of items) {
      if (it.kind === 'obs') this.drawObstacle(it.o);
      else if (it.kind === 'portal') this.drawPortal(it.o);
      else if (it.kind === 'npc') this.drawNpc(it.o);
      else if (it.kind === 'actor') this.drawActor(it.o);
      else if (it.kind === 'proj') this.drawProjectile(it.o);
    }

    this.drawParticles(g.fx.parts);
    this.drawNumbers(g.fx.numbers);
    this.drawMinimap();
  }

  drawGround(w) {
    const ctx = this.ctx;
    const base = (w.ground || w.def.ground), acc = (w.accent || w.def.accent);
    for (let y = 0; y < w.h; y++) {
      for (let x = 0; x < w.w; x++) {
        const s = this.worldToScreen(x + 0.5, y + 0.5);
        if (s.x < -TW || s.x > this.vw + TW || s.y < -TH * 3 || s.y > this.vh + TH * 3) continue;
        const t = w.tiles[y][x];
        ctx.beginPath();
        const hw = (TW / 2) * this.cam.zoom, hh = (TH / 2) * this.cam.zoom;
        ctx.moveTo(s.x, s.y - hh);
        ctx.lineTo(s.x + hw, s.y);
        ctx.lineTo(s.x, s.y + hh);
        ctx.lineTo(s.x - hw, s.y);
        ctx.closePath();
        ctx.fillStyle = ((x + y) % 2 === 0) ? base : this.shade(base, 1.08);
        ctx.fill();
        if (t > 0.94) { ctx.fillStyle = this.alpha(acc, 0.25); ctx.fill(); }
        ctx.strokeStyle = 'rgba(0,0,0,0.14)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }

  drawObstacle(o) {
    const ctx = this.ctx, z = this.cam.zoom;
    const s = this.worldToScreen(o.x, o.y);
    const h = o.height * TH * z;

    if (o.kind === 'building') {
      const hw = (o.bw / 2) * TW * 0.5 * z, hh = (o.bh / 2) * TH * 0.5 * z * 2;
      // gövde
      ctx.fillStyle = this.shade(o.color, 0.7);
      ctx.beginPath();
      ctx.moveTo(s.x - hw, s.y); ctx.lineTo(s.x - hw, s.y - h);
      ctx.lineTo(s.x, s.y - h + hh); ctx.lineTo(s.x, s.y + hh);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = this.shade(o.color, 0.5);
      ctx.beginPath();
      ctx.moveTo(s.x + hw, s.y); ctx.lineTo(s.x + hw, s.y - h);
      ctx.lineTo(s.x, s.y - h + hh); ctx.lineTo(s.x, s.y + hh);
      ctx.closePath(); ctx.fill();
      // çatı
      ctx.fillStyle = this.shade(o.color, 1.15);
      ctx.beginPath();
      ctx.moveTo(s.x, s.y - h - hh); ctx.lineTo(s.x + hw, s.y - h);
      ctx.lineTo(s.x, s.y - h + hh); ctx.lineTo(s.x - hw, s.y - h);
      ctx.closePath(); ctx.fill();
      if (o.name) {
        ctx.font = `600 ${12 * z}px Barlow, system-ui, sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(232,224,205,0.85)';
        ctx.fillText(o.name, s.x, s.y - h - hh - 6 * z);
      }
      return;
    }

    // kaya / ağaç / sütun
    const r = o.r * TW * 0.5 * z;
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.ellipse(s.x, s.y, r, r * 0.5, 0, 0, Math.PI * 2); ctx.fill();

    if (o.kind === 'tree') {
      ctx.fillStyle = this.shade(o.color, 0.5);
      ctx.fillRect(s.x - r * 0.18, s.y - h * 0.55, r * 0.36, h * 0.55);
      ctx.fillStyle = o.color;
      ctx.beginPath(); ctx.ellipse(s.x, s.y - h * 0.62, r * 0.95, r * 0.85, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = this.shade(o.color, 1.25);
      ctx.beginPath(); ctx.ellipse(s.x - r * 0.25, s.y - h * 0.72, r * 0.45, r * 0.4, 0, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = this.shade(o.color, 0.75);
      ctx.beginPath();
      ctx.moveTo(s.x - r, s.y); ctx.lineTo(s.x - r * 0.7, s.y - h);
      ctx.lineTo(s.x + r * 0.7, s.y - h); ctx.lineTo(s.x + r, s.y);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = this.shade(o.color, 1.2);
      ctx.beginPath(); ctx.ellipse(s.x, s.y - h, r * 0.7, r * 0.35, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  /* Maden taşı: kristal blok + can barı + nabız gibi atan element aurası */
  drawOre(a) {
    const ctx = this.ctx, z = this.cam.zoom;
    const s = this.worldToScreen(a.x, a.y);
    const r = a.r * TW * 0.5 * z;
    const h = 46 * a.size * z;
    const t = performance.now() / 1000;

    // gölge
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(s.x, s.y, r * 1.05, r * 0.5, 0, 0, Math.PI * 2); ctx.fill();

    if (a.dead) {
      ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = a.color;
      ctx.beginPath(); ctx.ellipse(s.x, s.y, r * 0.9, r * 0.42, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore(); return;
    }

    // aura
    ctx.save();
    ctx.globalAlpha = 0.20 + Math.sin(t * 2.2 + a.pulse) * 0.10;
    const g = ctx.createRadialGradient(s.x, s.y - h * 0.4, 2, s.x, s.y - h * 0.4, r * 2.4);
    g.addColorStop(0, a.color); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(s.x, s.y - h * 0.35, r * 2.4, r * 1.7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // kristal gövde (iki yüzlü prizma)
    const flash = a.hitFlash > 0;
    const body = flash ? '#ffffff' : a.color;
    ctx.fillStyle = this.shade(body, 0.55);
    ctx.beginPath();
    ctx.moveTo(s.x - r, s.y); ctx.lineTo(s.x - r * 0.55, s.y - h * 0.8);
    ctx.lineTo(s.x, s.y - h); ctx.lineTo(s.x, s.y - h * 0.05);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = this.shade(body, 1.1);
    ctx.beginPath();
    ctx.moveTo(s.x + r, s.y); ctx.lineTo(s.x + r * 0.55, s.y - h * 0.8);
    ctx.lineTo(s.x, s.y - h); ctx.lineTo(s.x, s.y - h * 0.05);
    ctx.closePath(); ctx.fill();
    // taban kaya
    ctx.fillStyle = 'rgba(30,34,44,0.9)';
    ctx.beginPath(); ctx.ellipse(s.x, s.y - 2 * z, r * 1.0, r * 0.42, 0, 0, Math.PI * 2); ctx.fill();

    // can barı + ad
    const bw = 64 * z, bh = 6 * z, by = s.y - h - 16 * z;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(s.x - bw / 2, by, bw, bh);
    ctx.fillStyle = a.color;
    ctx.fillRect(s.x - bw / 2, by, bw * U.clamp(a.hp / a.maxHp, 0, 1), bh);
    ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 1;
    ctx.strokeRect(s.x - bw / 2, by, bw, bh);
    ctx.font = `700 ${11 * z}px Barlow, system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(232,224,205,0.92)';
    ctx.fillText(`${a.name} · Lv${a.level}`, s.x, by - 4 * z);
    if (a.wavesLeft > 0) {
      ctx.font = `600 ${9.5 * z}px Barlow, system-ui, sans-serif`;
      ctx.fillStyle = 'rgba(255,180,90,0.8)';
      ctx.fillText(`${a.wavesLeft} dalga kaldı`, s.x, by + bh + 10 * z);
    }
  }

  drawPortal(p) {
    const ctx = this.ctx, z = this.cam.zoom;
    const s = this.worldToScreen(p.x, p.y);
    const t = performance.now() / 1000;
    const r = p.r * TW * 0.45 * z;
    ctx.save();
    ctx.globalAlpha = 0.75 + Math.sin(t * 3) * 0.2;
    const grd = ctx.createRadialGradient(s.x, s.y - r * 0.6, 2, s.x, s.y - r * 0.6, r * 1.6);
    grd.addColorStop(0, this.alpha(p.color, 0.95));
    grd.addColorStop(1, this.alpha(p.color, 0));
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.ellipse(s.x, s.y - r * 0.6, r * 1.5, r * 1.7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    ctx.strokeStyle = p.color; ctx.lineWidth = 2.5 * z;
    ctx.beginPath(); ctx.ellipse(s.x, s.y, r, r * 0.5, 0, 0, Math.PI * 2); ctx.stroke();

    ctx.font = `700 ${12 * z}px Barlow, system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e8e0cd';
    ctx.fillText(p.label, s.x, s.y - r * 2.1);
  }

  drawNpc(n) {
    const ctx = this.ctx, z = this.cam.zoom;
    const s = this.worldToScreen(n.x, n.y);
    const colors = { market: '#e8c04a', craft: '#c9723a', quest: '#7fc4ff', storage: '#9fe0a0' };
    const c = colors[n.kind] || '#fff';
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(s.x, s.y, 13 * z, 6 * z, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = this.shade(c, 0.75);
    ctx.beginPath();
    ctx.moveTo(s.x - 9 * z, s.y); ctx.lineTo(s.x - 6 * z, s.y - 26 * z);
    ctx.lineTo(s.x + 6 * z, s.y - 26 * z); ctx.lineTo(s.x + 9 * z, s.y);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f0e0c8';
    ctx.beginPath(); ctx.arc(s.x, s.y - 32 * z, 6 * z, 0, Math.PI * 2); ctx.fill();
    ctx.font = `600 ${11 * z}px Barlow, system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = c;
    ctx.fillText('❖ ' + n.name, s.x, s.y - 44 * z);
  }

  drawActor(a) {
    if (a.kind === 'stone') return this.drawOre(a);
    const ctx = this.ctx, z = this.cam.zoom;
    const s = this.worldToScreen(a.x, a.y);
    const scale = a.size * z;
    const bodyH = 34 * scale;

    // gölge
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(s.x, s.y, 15 * scale, 7 * scale, 0, 0, Math.PI * 2); ctx.fill();

    if (a.dead) {
      ctx.save();
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = a.color;
      ctx.beginPath(); ctx.ellipse(s.x, s.y - 3 * scale, 15 * scale, 6 * scale, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      return;
    }

    // ekran açısına dönüştürülmüş yön
    const fdx = Math.cos(a.facing), fdy = Math.sin(a.facing);
    const sang = Math.atan2((fdx + fdy) * (TH / 2), (fdx - fdy) * (TW / 2));
    const bob = Math.sin(a.animTime * 9) * (a.busy > 0 ? 0 : 1.2) * scale;

    // element aurası
    const race = a.element === 'ates' ? GameData.RACES.ates : GameData.RACES.su;
    if (a.team === 'player' || a.cls) {
      ctx.save();
      ctx.globalAlpha = 0.28;
      const g = ctx.createRadialGradient(s.x, s.y, 2, s.x, s.y, 26 * scale);
      g.addColorStop(0, race.colors.aura); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(s.x, s.y, 26 * scale, 13 * scale, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    const hit = a.hitFlash > 0;
    const main = hit ? '#ffffff' : a.color;

    // bacaklar
    ctx.strokeStyle = this.shade(main, 0.5);
    ctx.lineWidth = 4.5 * scale; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(s.x - 4 * scale, s.y - 10 * scale); ctx.lineTo(s.x - 5 * scale, s.y - 1 * scale);
    ctx.moveTo(s.x + 4 * scale, s.y - 10 * scale); ctx.lineTo(s.x + 5 * scale, s.y - 1 * scale);
    ctx.stroke();

    // gövde
    const ty = s.y - bodyH + bob;
    ctx.fillStyle = main;
    ctx.beginPath();
    ctx.moveTo(s.x - 9 * scale, s.y - 9 * scale);
    ctx.lineTo(s.x - 7.5 * scale, ty + 6 * scale);
    ctx.lineTo(s.x + 7.5 * scale, ty + 6 * scale);
    ctx.lineTo(s.x + 9 * scale, s.y - 9 * scale);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = this.alpha('#000', 0.18);
    ctx.beginPath();
    ctx.moveTo(s.x + 1 * scale, s.y - 9 * scale);
    ctx.lineTo(s.x + 1 * scale, ty + 6 * scale);
    ctx.lineTo(s.x + 7.5 * scale, ty + 6 * scale);
    ctx.lineTo(s.x + 9 * scale, s.y - 9 * scale);
    ctx.closePath(); ctx.fill();

    // kafa
    ctx.fillStyle = hit ? '#fff' : this.shade(main, 1.35);
    ctx.beginPath(); ctx.arc(s.x, ty - 2 * scale, 7 * scale, 0, Math.PI * 2); ctx.fill();

    // silah / sınıf işareti
    let swing = a.busy > 0 ? Math.sin((0.35 - Math.max(0, a.busy)) / 0.35 * Math.PI) : 0;
    let spinExtra = 0;
    if (a.swingT > 0 && a.swingDur > 0) {
      const t = 1 - U.clamp(a.swingT / a.swingDur, 0, 1);
      const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      if (a.swingSpin) { spinExtra = ease * Math.PI * 2; swing = 1; }        // 360° dönüş
      else swing = (a.swingStep === 1 ? -1 : 1) * (1 - Math.abs(ease - 0.5) * 2) * 1.6;
    }
    const wx = s.x + Math.cos(sang) * 13 * scale;
    const wy = ty + 6 * scale + Math.sin(sang) * 7 * scale;
    ctx.save();
    ctx.translate(wx, wy);
    ctx.rotate(sang + swing * 1.5 - 0.6 + spinExtra);
    const cls = a.cls || (a.tier ? 'monster' : 'savasci');
    if (cls === 'okcu') {
      ctx.strokeStyle = '#c9a06a'; ctx.lineWidth = 3 * scale;
      ctx.beginPath(); ctx.arc(0, 0, 11 * scale, -1.1, 1.1); ctx.stroke();
      ctx.strokeStyle = this.alpha('#fff', 0.6); ctx.lineWidth = 1.2 * scale;
      ctx.beginPath(); ctx.moveTo(5 * scale, -9.5 * scale); ctx.lineTo(5 * scale, 9.5 * scale); ctx.stroke();
    } else if (cls === 'buyucu') {
      ctx.strokeStyle = '#8a6a4a'; ctx.lineWidth = 3.5 * scale;
      ctx.beginPath(); ctx.moveTo(-4 * scale, 10 * scale); ctx.lineTo(2 * scale, -12 * scale); ctx.stroke();
      ctx.fillStyle = race.colors.primary;
      ctx.beginPath(); ctx.arc(2.5 * scale, -14 * scale, 4.5 * scale, 0, Math.PI * 2); ctx.fill();
    } else if (cls === 'savasci') {
      ctx.strokeStyle = '#dfe4ee'; ctx.lineWidth = 4 * scale;
      ctx.beginPath(); ctx.moveTo(-3 * scale, 6 * scale); ctx.lineTo(16 * scale, -8 * scale); ctx.stroke();
      ctx.strokeStyle = '#8a6a4a'; ctx.lineWidth = 4.5 * scale;
      ctx.beginPath(); ctx.moveTo(-6 * scale, 9 * scale); ctx.lineTo(-2 * scale, 6 * scale); ctx.stroke();
    } else {
      ctx.fillStyle = this.shade(main, 0.7);
      ctx.beginPath(); ctx.ellipse(0, 0, 7 * scale, 4 * scale, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    // durum efektleri
    if (a.effects.length) {
      let ox = -((a.effects.length - 1) * 5 * scale) / 2;
      for (const e of a.effects) {
        const col = e.type === 'burn' ? '#ff7a2f' : e.type === 'slow' ? '#4fd6ff'
          : e.type === 'stun' ? '#ffd15c' : '#9fe0a0';
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(s.x + ox, ty - 16 * scale, 2.6 * scale, 0, Math.PI * 2); ctx.fill();
        ox += 5 * scale;
      }
    }

    // HP barı (oyuncu hariç, üstte DOM barı var)
    if (a.team !== 'player') this.drawHpBar(a, s, scale, ty);
  }

  drawHpBar(a, s, scale, ty) {
    const ctx = this.ctx;
    const w = (a.tier === 'boss' ? 60 : 34) * scale;
    const h = 5 * scale;
    const x = s.x - w / 2, y = ty - 26 * scale;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
    const ratio = U.clamp(a.hp / a.maxHp, 0, 1);
    ctx.fillStyle = a.tier === 'boss' ? '#ff4d6d' : (a.cls ? '#ff8a5c' : '#8fd45c');
    ctx.fillRect(x, y, w * ratio, h);
    ctx.font = `600 ${9.5 * scale}px Barlow, system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(232,224,205,0.9)';
    ctx.fillText(`${a.name} · Lv${a.level}`, s.x, y - 4 * scale);
  }

  drawProjectile(p) {
    const ctx = this.ctx, z = this.cam.zoom;
    const s = this.worldToScreen(p.x, p.y);
    const r = p.size * TW * 0.4 * z;
    ctx.save();
    const g = ctx.createRadialGradient(s.x, s.y - 16 * z, 1, s.x, s.y - 16 * z, r * 2.2);
    g.addColorStop(0, p.color); g.addColorStop(1, this.alpha(p.color, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(s.x, s.y - 16 * z, r * 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s.x, s.y - 16 * z, r * 0.55, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  drawAreaMarker(a) {
    const ctx = this.ctx, z = this.cam.zoom;
    const s = this.worldToScreen(a.x, a.y);
    const rx = a.radius * TW * 0.5 * z, ry = a.radius * TH * 0.5 * z;
    ctx.save();
    ctx.globalAlpha = 0.22 + Math.sin(performance.now() / 90) * 0.05;
    ctx.fillStyle = a.color;
    ctx.beginPath(); ctx.ellipse(s.x, s.y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.7;
    ctx.strokeStyle = a.color; ctx.lineWidth = 2 * z;
    ctx.beginPath(); ctx.ellipse(s.x, s.y, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  drawRing(r) {
    const ctx = this.ctx, z = this.cam.zoom;
    const s = this.worldToScreen(r.x, r.y);
    ctx.save();
    ctx.globalAlpha = U.clamp(r.life / r.total, 0, 1) * 0.8;
    ctx.strokeStyle = r.color; ctx.lineWidth = 3 * z;
    ctx.beginPath();
    ctx.ellipse(s.x, s.y, r.r * TW * 0.5 * z, r.r * TH * 0.5 * z, 0, 0, Math.PI * 2);
    ctx.stroke(); ctx.restore();
  }

  drawArc(a) {
    const ctx = this.ctx, z = this.cam.zoom;
    const s = this.worldToScreen(a.x, a.y);
    const fdx = Math.cos(a.angle), fdy = Math.sin(a.angle);
    const sang = Math.atan2((fdx + fdy) * (TH / 2), (fdx - fdy) * (TW / 2));
    ctx.save();
    ctx.globalAlpha = U.clamp(a.life / a.total, 0, 1) * 0.75;
    ctx.translate(s.x, s.y - 16 * z);
    ctx.scale(1, TH / TW);
    ctx.rotate(sang);
    ctx.strokeStyle = a.color; ctx.lineWidth = 7 * z;
    ctx.beginPath(); ctx.arc(0, 0, a.radius * TW * 0.5 * z, -0.7, 0.7); ctx.stroke();
    ctx.restore();
  }

  /* Süpüren kılıç izi — Metin2 savaşçısının vuruş hissi */
  drawSwing(sw) {
    const ctx = this.ctx, z = this.cam.zoom;
    const s = this.worldToScreen(sw.x, sw.y);
    const fdx = Math.cos(sw.angle), fdy = Math.sin(sw.angle);
    const sang = Math.atan2((fdx + fdy) * (TH / 2), (fdx - fdy) * (TW / 2));
    const t = 1 - U.clamp(sw.life / sw.total, 0, 1);        // 0 → 1 ilerleme
    const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const head = sw.from + (sw.to - sw.from) * ease;         // kılıcın ucu
    const tail = sw.from + (sw.to - sw.from) * Math.max(0, ease - 0.42);
    const R = sw.radius * TW * 0.5 * z;

    ctx.save();
    ctx.translate(s.x, s.y - 16 * z);
    ctx.scale(1, TH / TW);
    ctx.rotate(sang);
    ctx.globalCompositeOperation = 'lighter';

    // iz (kuyruktan başa doğru solan şerit)
    const steps = 10;
    for (let i = 0; i < steps; i++) {
      const a0 = tail + (head - tail) * (i / steps);
      const a1 = tail + (head - tail) * ((i + 1) / steps);
      ctx.globalAlpha = (0.10 + 0.55 * (i / steps)) * U.clamp(sw.life / sw.total + 0.35, 0, 1);
      ctx.strokeStyle = sw.color;
      ctx.lineWidth = (sw.width * (0.45 + 0.55 * (i / steps))) * z;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(0, 0, R, Math.min(a0, a1), Math.max(a0, a1));
      ctx.stroke();
    }
    // kılıcın ucundaki parlama
    ctx.globalAlpha = 0.9 * U.clamp(sw.life / sw.total, 0, 1);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(Math.cos(head) * R, Math.sin(head) * R, 3.2 * z, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  drawParticles(parts) {
    const ctx = this.ctx, z = this.cam.zoom;
    for (const p of parts) {
      const s = this.worldToScreen(p.x, p.y);
      ctx.save();
      ctx.globalAlpha = U.clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(s.x, s.y - p.z * 18 * z, p.size * z, 0, Math.PI * 2);
      ctx.fill(); ctx.restore();
    }
  }

  drawNumbers(nums) {
    const ctx = this.ctx, z = this.cam.zoom;
    ctx.textAlign = 'center';
    for (const n of nums) {
      const s = this.worldToScreen(n.x, n.y);
      const t = 1 - n.life;
      const y = s.y - 40 * z - t * 34 * z;
      ctx.save();
      ctx.globalAlpha = U.clamp(n.life * 1.4, 0, 1);
      let color = '#f2eee0', size = 15, text = U.fmt(n.value);
      if (n.crit) { color = '#ffd15c'; size = 22; text = U.fmt(n.value) + '!'; }
      if (n.heal) { color = '#8fd45c'; text = '+' + U.fmt(n.value); }
      if (n.burn) { color = '#ff8a4a'; size = 12; }
      if (n.xp) { color = '#7fc4ff'; text = '+' + U.fmt(n.value) + ' XP'; }
      if (n.mana) { color = '#6ba8ff'; text = '+' + U.fmt(n.value) + ' MP'; }
      ctx.font = `800 ${size * z}px Barlow, system-ui, sans-serif`;
      ctx.lineWidth = 3 * z; ctx.strokeStyle = 'rgba(0,0,0,0.75)';
      ctx.strokeText(text, s.x, y); ctx.fillStyle = color;
      ctx.fillText(text, s.x, y);
      if (n.crit) {
        ctx.font = `700 ${9 * z}px Barlow, system-ui, sans-serif`;
        ctx.fillStyle = '#ffd15c';
        ctx.fillText('CRITICAL', s.x, y - 16 * z);
      }
      if (n.pen) {
        ctx.font = `700 ${9 * z}px Barlow, system-ui, sans-serif`;
        ctx.fillStyle = '#ff9ad0';
        ctx.fillText('PENETRATE', s.x, y + 12 * z);
      }
      ctx.restore();
    }
  }

  drawMinimap() {
    if (!this.mctx) return;
    const g = this.game, w = g.world, ctx = this.mctx;
    const size = this.mini.width;
    ctx.clearRect(0, 0, size, size);
    ctx.fillStyle = 'rgba(8,11,20,0.85)';
    ctx.fillRect(0, 0, size, size);
    const sc = size / Math.max(w.w, w.h);
    ctx.fillStyle = 'rgba(120,140,180,0.25)';
    for (const o of w.obstacles) ctx.fillRect(o.x * sc - 1, o.y * sc - 1, 2.5, 2.5);
    for (const p of w.portals) {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x * sc - 2, p.y * sc - 2, 4, 4);
    }
    for (const a of g.actors) {
      if (a.dead) continue;
      ctx.fillStyle = a.team === 'player' ? '#ffd15c' : (a.tier === 'boss' ? '#ff4d6d' : '#ff8a5c');
      ctx.fillRect(a.x * sc - 1.5, a.y * sc - 1.5, 3, 3);
    }
  }

  /* renk yardımcıları */
  shade(hex, f) {
    const c = hex.replace('#', '');
    const n = parseInt(c.length === 3 ? c.split('').map(x => x + x).join('') : c, 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = U.clamp(Math.round(r * f), 0, 255);
    g = U.clamp(Math.round(g * f), 0, 255);
    b = U.clamp(Math.round(b * f), 0, 255);
    return `rgb(${r},${g},${b})`;
  }
  alpha(hex, a) {
    if (hex.startsWith('rgb')) return hex.replace('rgb(', 'rgba(').replace(')', `,${a})`);
    const c = hex.replace('#', '');
    const n = parseInt(c.length === 3 ? c.split('').map(x => x + x).join('') : c, 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  }
}
