<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Çağlar Arası — Su ve Ateş</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- =========================================================
     1) KARAKTER OLUŞTURMA
     ========================================================= -->
<section id="screen-create" class="screen">
  <div class="create-wrap">
    <header class="create-head">
      <p class="eyebrow">Çağ 1 · İlk Çağ</p>
      <h1>ÇAĞLAR ARASI</h1>
      <p class="sub">Su ve Ateş'in yedi çağ süren savaşı. Irkını seç, buildini kur, arenada kanıtla.</p>
    </header>

    <div id="continue-box" class="continue hidden"></div>

    <div class="field">
      <label for="char-name">Karakter adı</label>
      <input id="char-name" maxlength="14" placeholder="Gezgin" autocomplete="off">
    </div>

    <h2 class="step">Irk</h2>
    <div id="race-list" class="picks two"></div>

    <h2 class="step">Sınıf</h2>
    <div id="class-list" class="picks three"></div>

    <div class="create-foot">
      <div id="preview" class="preview"></div>
      <button id="btn-start" class="btn primary big">Dünyaya gir</button>
    </div>

    <p class="note">Kayıt tarayıcında saklanır. Kontroller: WASD hareket · sol tık saldırı · 1-4 yetenek · E etkileşim · H yardım.</p>
  </div>
</section>

<!-- =========================================================
     2) OYUN
     ========================================================= -->
<div id="screen-game" class="hidden">
  <canvas id="game"></canvas>

  <div id="hud">
    <!-- Sol üst: karakter -->
    <div class="hud-player">
      <div class="portrait"><span id="p-level">Lv 1</span></div>
      <div class="pbars">
        <div class="pname"><b id="p-name">—</b><span id="p-class">—</span></div>
        <div class="bar hp"><div class="fill" id="hp-fill"></div><span id="hp-text"></span></div>
        <div class="bar xp"><div class="fill" id="xp-fill"></div><span id="xp-text"></span></div>
        <div class="bar mana"><div class="fill" id="mana-fill"></div></div>
      </div>
    </div>

    <!-- Üst: kaynaklar + menü -->
    <div class="hud-top">
      <div class="res"><i class="ic gold"></i><span id="res-gold">0</span></div>
      <div class="res"><i class="ic mat"></i><span id="res-mats">0</span></div>
      <div class="res age"><span id="res-age">İlk Çağ</span></div>
      <nav class="menu">
        <button data-panel="char" title="Karakter (C)">Karakter<span id="statpoint-dot" class="dot hidden">0</span></button>
        <button data-panel="inventory" title="Envanter (I)">Envanter</button>
        <button data-panel="skills" title="Yetenekler (Y)">Yetenek</button>
        <button data-panel="quest" title="Görevler (K)">Görev</button>
        <button data-panel="age" title="Çağlar (M)">Çağ</button>
        <button data-panel="pvp" title="PvP">PvP</button>
        <button data-panel="help" title="Yardım (H)">?</button>
      </nav>
    </div>

    <!-- Sağ: mini harita + görev takibi -->
    <div class="hud-right">
      <div class="minibox">
        <canvas id="minimap" width="150" height="150"></canvas>
        <div id="zone-name">—</div>
      </div>
      <div id="quest-tracker"></div>
    </div>

    <!-- Boss / PvP barları -->
    <div id="boss-bar" class="hidden"></div>
    <div id="pvp-bar" class="hidden"></div>

    <!-- Etkileşim ipucu -->
    <div id="interact-hint" class="hidden"></div>
    <div id="combo-ind" class="hidden"></div>

    <!-- Alt: yetenek çubuğu -->
    <div id="skillbar"></div>

    <!-- Mobil joystick -->
    <div id="joystick"><div id="joy-knob"></div></div>

    <!-- Mobil aksiyon tuşları -->
    <div id="touch-actions">
      <button id="tb-interact" class="tbtn small" aria-label="Etkileşim">E</button>
      <button id="tb-dash" class="tbtn small" aria-label="Sıçra">⇉</button>
      <button id="tb-attack" class="tbtn big" aria-label="Saldır">⚔</button>
    </div>

    <!-- Mobil menü aç/kapat -->
    <button id="menu-toggle" aria-label="Menü">☰</button>

    <div id="toasts"></div>
  </div>

  <!-- Panel katmanı -->
  <div id="modal-layer" class="hidden"><div id="modal" class="modal"></div></div>
</div>

<!-- =========================================================
     Betikler — yükleme sırası bağımlılığa göre
     ========================================================= -->
<script src="js/utils.js"></script>
<script src="js/data.js"></script>
<script src="js/stats.js"></script>
<script src="js/combat.js"></script>
<script src="js/loot.js"></script>
<script src="js/skills.js"></script>
<script src="js/entities.js"></script>
<script src="js/world.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/input.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
