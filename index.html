<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Akçay Vakayinamesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- KARAKTER OLUŞTURMA -->
<div id="gate" class="hidden"></div>

<!-- ANA OYUN -->
<div id="app" class="hidden">

  <!-- ÜST: karakter künyesi + barlar -->
  <header id="hud">
    <div class="hud-portrait">
      <div class="pf-level"><span id="chLevel">1</span></div>
      <div class="pf-id">
        <b id="chName">—</b>
        <i id="chClass">—</i>
      </div>
    </div>

    <div class="hud-bars">
      <div class="bar hp" id="hpBar"><i></i><span></span><em>CAN</em></div>
      <div class="bar mp" id="mpBar"><i></i><span></span><em>MANA</em></div>
      <div class="bar exp" id="expBar"><i></i><span></span><em>DENEYİM</em></div>
    </div>

    <div class="hud-right">
      <div class="yang-box"><span class="coin">◎</span><b id="yang">0</b><i>yang</i></div>
      <div id="buffs" class="buffs"></div>
      <nav class="hud-nav">
        <button id="btnMaps" title="M">Bölgeler</button>
        <button id="btnSkills" title="K">Yetenek</button>
        <button id="btnUpgrade" title="U">Geliştir</button>
        <button id="btnTown">Kasaba</button>
        <button id="btnReset" class="danger">Sıfırla</button>
      </nav>
    </div>
  </header>

  <!-- ORTA: üç sütun -->
  <main id="board">

    <!-- SOL: ekipman + statlar -->
    <section class="panel col-left">
      <h2 class="p-title">Karakter</h2>
      <div id="equipGrid" class="equip-grid"></div>
      <div class="dmg-line">Silah hasarı <b id="dmgLine">—</b></div>
      <h3 class="p-sub">Özellikler</h3>
      <ul id="statList" class="stat-list"></ul>
    </section>

    <!-- ORTA: harita + savaş -->
    <section class="panel col-mid">
      <div id="field" class="field" data-theme="town">
        <div class="field-head">
          <h2 id="mapName">—</h2>
          <p id="mapDesc">—</p>
        </div>

        <div id="mobPanel" class="mob-panel hidden">
          <div id="mobList" class="mob-list"></div>
        </div>

        <div id="townPanel" class="town-panel">
          <div id="npcList" class="npc-list"></div>
        </div>
      </div>

      <div class="log-wrap">
        <h3 class="p-sub">Vakayiname</h3>
        <div id="log" class="log"></div>
      </div>
    </section>

    <!-- SAĞ: envanter -->
    <section class="panel col-right">
      <h2 class="p-title">Çanta <em id="invCount">0 / 45</em></h2>
      <div id="invGrid" class="inv-grid"></div>
      <p class="hint">Sol tık: kuşan / kullan · Sağ tık: menü · Sürükle: yuvaya bırak</p>
    </section>
  </main>

  <!-- ALT: yetenek çubuğu -->
  <footer id="skillBar" class="skill-bar"></footer>
</div>

<!-- KATMANLAR -->
<div id="tooltip" class="tooltip hidden"></div>
<div id="ctxMenu" class="ctx hidden"></div>
<div id="toasts" class="toasts"></div>
<div id="flash" class="flash"></div>

<div id="modal" class="modal hidden">
  <div class="m-card">
    <header class="m-head">
      <h2 class="m-title">—</h2>
      <button class="m-close" aria-label="Kapat">✕</button>
    </header>
    <div class="m-body"></div>
  </div>
</div>

<!-- VERİ (paylaşımlı, sunucu da aynı dosyaları kullanır) -->
<script src="data/balance.js"></script>
<script src="data/items.js"></script>
<script src="data/world.js"></script>
<script src="data/skills.js"></script>
<!-- SUNUCU (yerel modda aynı sekmede çalışır) -->
<script src="server/core.js"></script>
<script src="server/gameserver.js"></script>
<!-- CLIENT -->
<script src="client/icons.js"></script>
<script src="client/net.js"></script>
<script src="client/app.js"></script>
</body>
</html>
