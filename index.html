<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Çağlar Arası — Su ve Ateş</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =============================================================
   style.css — Çağlar Arası
   Palet: obsidyen zemin, parşömen yazı, ırk rengi vurgu
   ============================================================= */

:root {
  --bg: #080b14;
  --bg2: #0e1220;
  --panel: #131828;
  --panel2: #1a2033;
  --line: #2a3350;
  --ink: #e8e0cd;
  --dim: #94a0bb;
  --gold: #e8c04a;
  --danger: #ff4d6d;
  --good: #8fd45c;
  --warn: #ffab3a;
  --accent: #4fd6ff;

  --r-common: #b8b8b8;
  --r-uncommon: #69c76a;
  --r-rare: #4aa3ff;
  --r-epic: #b06cff;
  --r-legendary: #ffa93a;
  --r-mythic: #ff4d6d;

  --font-d: 'Cinzel', Georgia, serif;
  --font-b: 'Barlow', system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-b);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.hidden { display: none !important; }
.dim { color: var(--dim); }
.small { font-size: 12px; }
h1, h2, h3, h4 { font-family: var(--font-d); letter-spacing: .02em; }

/* ---------------- Butonlar ---------------- */
.btn {
  font-family: var(--font-b); font-weight: 600; font-size: 14px;
  color: var(--ink); background: var(--panel2);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 14px; cursor: pointer; transition: .15s;
}
.btn:hover:not(:disabled) { background: #222a42; border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #000)); color: #06101a; border: none; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.12); }
.btn.ghost { background: transparent; }
.btn.danger { border-color: #5a2233; color: #ff8ea3; }
.btn.big { font-size: 16px; padding: 13px 26px; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* =============================================================
   1) KARAKTER OLUŞTURMA
   ============================================================= */
.screen { height: 100%; overflow-y: auto; }
.create-wrap {
  max-width: 1000px; margin: 0 auto; padding: 46px 20px 60px;
}
.create-head { text-align: center; margin-bottom: 26px; }
.eyebrow {
  font-size: 12px; letter-spacing: .32em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 10px;
}
.create-head h1 {
  font-size: clamp(34px, 7vw, 62px); font-weight: 800; letter-spacing: .16em;
  background: linear-gradient(180deg, #fff6e2, var(--accent));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.create-head .sub { color: var(--dim); margin-top: 10px; font-size: 15px; }

.continue {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--gold);
  border-radius: 10px; padding: 14px 18px; margin-bottom: 22px;
}
.continue h3 { font-size: 18px; }

.field { margin-bottom: 24px; }
.field label { display: block; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
.field input, .row input {
  width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--ink);
  border-radius: 8px; padding: 12px 14px; font-family: var(--font-b); font-size: 15px;
}
.step {
  font-size: 13px; letter-spacing: .28em; text-transform: uppercase;
  color: var(--dim); margin: 26px 0 12px;
  border-bottom: 1px solid var(--line); padding-bottom: 8px;
}
.picks { display: grid; gap: 12px; }
.picks.two { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.picks.three { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.pick {
  text-align: left; background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; padding: 16px; color: var(--ink); cursor: pointer; transition: .16s;
}
.pick:hover { border-color: var(--c); transform: translateY(-2px); }
.pick.on { border-color: var(--c); box-shadow: 0 0 0 1px var(--c), 0 10px 30px -14px var(--c); background: linear-gradient(180deg, color-mix(in srgb, var(--c) 12%, var(--panel)), var(--panel)); }
.pick .glyph { font-size: 26px; color: var(--c); display: block; margin-bottom: 6px; }
.pick h3 { font-size: 19px; color: var(--c); margin-bottom: 4px; }
.pick .role { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; }
.pick p { font-size: 13.5px; color: var(--dim); line-height: 1.5; }
.pick .bonus { display: block; margin-top: 10px; font-size: 12px; color: var(--c); opacity: .9; }

.create-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
  margin-top: 26px; flex-wrap: wrap;
}
.preview { flex: 1; min-width: 260px; }
.preview h4 { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
.pv-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px 14px; }
.pv-stats div { display: flex; justify-content: space-between; font-size: 13px; border-bottom: 1px dashed var(--line); padding-bottom: 3px; }
.pv-stats span { color: var(--dim); }
.note { margin-top: 24px; font-size: 12px; color: #6d7896; text-align: center; }

/* =============================================================
   2) OYUN EKRANI
   ============================================================= */
#screen-game { position: fixed; inset: 0; }
#game { width: 100%; height: 100%; display: block; cursor: crosshair; }

#hud { position: absolute; inset: 0; pointer-events: none; font-size: 13px; }
#hud button, #hud input { pointer-events: auto; }

/* --- Sol üst oyuncu paneli --- */
.hud-player {
  position: absolute; top: 12px; left: 12px; display: flex; gap: 10px;
  background: rgba(12,16,28,.78); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px; backdrop-filter: blur(6px); min-width: 268px;
}
.portrait {
  width: 46px; height: 46px; border-radius: 10px; flex: none;
  background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--accent) 60%, #000), #0b1020);
  border: 1px solid var(--accent); display: grid; place-items: center;
  font-family: var(--font-d); font-weight: 800; font-size: 12px; color: var(--ink);
}
.pbars { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.pname { display: flex; justify-content: space-between; align-items: baseline; }
.pname b { font-family: var(--font-d); font-size: 14px; }
.pname span { font-size: 11px; color: var(--dim); }
.bar { position: relative; height: 13px; background: #0a0e18; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.bar span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 10px; font-weight: 700; text-shadow: 0 1px 2px #000; }
.bar .fill { height: 100%; transition: width .18s; }
.bar.hp .fill { background: linear-gradient(90deg, #d8324a, #ff6a5c); }
.bar.xp { height: 7px; }
.bar.xp .fill { background: linear-gradient(90deg, #3a7fd0, #7fc4ff); }
.bar.mana { height: 5px; }
.bar.mana .fill { background: linear-gradient(90deg, #6a4fd0, #b06cff); }

/* --- Üst kaynak & menü --- */
.hud-top {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 8px;
  background: rgba(12,16,28,.78); border: 1px solid var(--line);
  border-radius: 12px; padding: 7px 10px; backdrop-filter: blur(6px);
}
.res { display: flex; align-items: center; gap: 6px; font-weight: 700; padding: 0 6px; }
.res.age { font-family: var(--font-d); font-size: 12px; color: var(--gold); border-left: 1px solid var(--line); padding-left: 12px; }
.ic { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.ic.gold { background: linear-gradient(135deg, #ffe9a8, var(--gold)); }
.ic.mat { background: linear-gradient(135deg, #a8e6ff, #4a90c9); }
.menu { display: flex; gap: 4px; margin-left: 6px; border-left: 1px solid var(--line); padding-left: 10px; }
.menu button {
  position: relative; background: transparent; border: 1px solid transparent; color: var(--dim);
  font-family: var(--font-b); font-weight: 600; font-size: 12.5px;
  padding: 6px 10px; border-radius: 7px; cursor: pointer; transition: .14s;
}
.menu button:hover { color: var(--ink); background: var(--panel2); border-color: var(--line); }
.dot {
  position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px;
  background: var(--gold); color: #0b1020; border-radius: 8px;
  font-size: 10px; font-weight: 800; display: grid; place-items: center; padding: 0 4px;
}

/* --- Sağ: mini harita + görev --- */
.hud-right { position: absolute; top: 12px; right: 12px; width: 168px; }
.minibox { background: rgba(12,16,28,.78); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
#minimap { width: 150px; height: 150px; display: block; border-radius: 6px; }
#zone-name { text-align: center; font-family: var(--font-d); font-size: 12px; margin-top: 6px; color: var(--accent); }
#quest-tracker { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.qt {
  background: rgba(12,16,28,.7); border-left: 2px solid var(--accent);
  padding: 5px 8px; border-radius: 0 6px 6px 0; display: flex; justify-content: space-between; gap: 8px;
  font-size: 11.5px;
}
.qt.done { border-left-color: var(--good); color: var(--good); }
.qt-num { color: var(--dim); font-weight: 700; }
.qt-empty { font-size: 11px; color: #616c88; padding: 4px 8px; }

/* --- Boss & PvP barları --- */
#boss-bar {
  position: absolute; top: 74px; left: 50%; transform: translateX(-50%);
  width: min(560px, 80vw); background: rgba(12,16,28,.82);
  border: 1px solid #4a2333; border-radius: 10px; padding: 8px 12px;
}
.bb-name { font-family: var(--font-d); font-size: 14px; margin-bottom: 5px; display: flex; justify-content: space-between; }
.bb-name span { font-family: var(--font-b); font-size: 11px; color: var(--dim); }
.bar.big { height: 15px; }
.fill.boss { background: linear-gradient(90deg, #8a1030, var(--danger)); }

#pvp-bar {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 14px;
  background: rgba(12,16,28,.85); border: 1px solid var(--line);
  border-radius: 12px; padding: 10px 16px; width: min(680px, 92vw);
}
.pvp-side { flex: 1; }
.pvp-side.right { text-align: right; }
.pn { font-family: var(--font-d); font-size: 13px; margin-bottom: 4px; }
.fill.ally { background: linear-gradient(90deg, #2f7fd0, #7fc4ff); }
.fill.foe { background: linear-gradient(90deg, #ff6a3a, #ffab3a); }
.pvp-timer { font-family: var(--font-d); font-size: 20px; text-align: center; line-height: 1; }
.pvp-timer span { display: block; font-size: 10px; color: var(--dim); letter-spacing: .2em; }

/* --- Etkileşim ipucu --- */
#interact-hint {
  position: absolute; bottom: 132px; left: 50%; transform: translateX(-50%);
  background: rgba(12,16,28,.85); border: 1px solid var(--accent);
  border-radius: 8px; padding: 7px 14px; font-size: 13px;
}
#interact-hint b {
  display: inline-block; background: var(--accent); color: #06101a;
  border-radius: 4px; padding: 1px 6px; margin-right: 6px; font-size: 11px;
}

/* --- Yetenek çubuğu --- */
#skillbar {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px;
}
.skill {
  position: relative; width: 74px; height: 66px; overflow: hidden;
  background: rgba(16,21,36,.9); border: 1px solid var(--line); border-radius: 10px;
  color: var(--ink); cursor: pointer; display: flex; flex-direction: column;
  justify-content: flex-end; padding: 6px; transition: .14s;
}
.skill:hover { border-color: var(--accent); }
.skill.nomana { opacity: .55; }
.skill .key {
  position: absolute; top: 4px; left: 6px; font-size: 10px; font-weight: 800;
  color: var(--accent); letter-spacing: .06em;
}
.skill .mana { position: absolute; top: 4px; right: 6px; font-size: 10px; color: #b06cff; font-weight: 700; }
.skill .count { position: absolute; top: 4px; right: 6px; font-size: 11px; color: var(--good); font-weight: 800; }
.skill .sname { font-size: 11px; font-weight: 600; line-height: 1.15; text-align: left; }
.skill .cd { position: absolute; left: 0; bottom: 0; width: 100%; height: 0%; background: rgba(4,7,14,.72); transition: height .1s linear; }
.skill .cd-text { position: absolute; inset: 0; display: grid; place-items: center; font-size: 18px; font-weight: 800; color: #fff; }
.skill.util { width: 60px; }
.skill.util .sname { font-size: 10.5px; color: var(--dim); }

/* --- Joystick (dokunmatik) --- */
#joystick {
  position: absolute; bottom: 96px; left: 26px; width: 112px; height: 112px;
  border-radius: 50%; border: 1px solid var(--line); background: rgba(12,16,28,.4);
  display: none; pointer-events: auto; touch-action: none;
}
#joy-knob {
  position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
  border-radius: 50%; background: rgba(120,160,220,.35); border: 1px solid var(--accent);
}

/* --- Toast --- */
#toasts { position: absolute; bottom: 100px; right: 16px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.toast {
  background: rgba(12,16,28,.92); border: 1px solid var(--line); border-left: 3px solid var(--accent);
  border-radius: 6px; padding: 8px 12px; font-size: 12.5px; max-width: 300px;
  animation: slidein .25s ease; transition: opacity .35s, transform .35s;
}
.toast-good { border-left-color: var(--good); }
.toast-warn { border-left-color: var(--warn); }
.toast.out { opacity: 0; transform: translateX(20px); }
@keyframes slidein { from { opacity: 0; transform: translateX(24px); } }

/* =============================================================
   3) PANELLER (modal)
   ============================================================= */
#modal-layer {
  position: absolute; inset: 0; background: rgba(4,6,12,.72);
  display: grid; place-items: center; padding: 20px; z-index: 30; pointer-events: auto;
  backdrop-filter: blur(3px);
}
.modal {
  width: min(620px, 100%); max-height: 86vh; display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 30px 80px -30px #000;
}
.modal.wide { width: min(920px, 100%); }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; border-bottom: 1px solid var(--line);
}
.modal-head h2 { font-size: 19px; }
.modal-head .pill, .pill {
  font-family: var(--font-b); font-size: 11px; font-weight: 700; color: var(--accent);
  background: color-mix(in srgb, var(--accent) 15%, transparent);
  border-radius: 20px; padding: 2px 9px; margin-left: 8px;
}
.close { background: none; border: none; color: var(--dim); font-size: 18px; cursor: pointer; }
.close:hover { color: var(--ink); }
.modal-body { padding: 16px 18px 20px; overflow-y: auto; }
.modal h4 { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); margin: 16px 0 8px; }
.modal h4:first-child { margin-top: 0; }

/* --- Karakter paneli --- */
.char-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.ident { display: flex; gap: 12px; align-items: center; margin-bottom: 6px; }
.ident-badge {
  width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center;
  font-family: var(--font-d); font-weight: 800; font-size: 20px;
  background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--c) 55%, #000), #0b1020);
  border: 1px solid var(--c);
}
.ident h3 { font-size: 18px; }
.ident p { font-size: 12.5px; color: var(--dim); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; }
.strow { display: flex; justify-content: space-between; font-size: 12.5px; border-bottom: 1px dashed var(--line); padding: 3px 0; }
.strow span { color: var(--dim); }
.alloc { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.alrow { display: grid; grid-template-columns: 1fr auto auto auto; gap: 6px; align-items: center; font-size: 12.5px; }
.alname .cap { font-style: normal; font-size: 10px; color: #66718c; margin-left: 4px; }
.alpts { font-weight: 800; color: var(--accent); min-width: 22px; text-align: right; }
.mini {
  background: var(--panel2); border: 1px solid var(--line); color: var(--ink);
  border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 700; cursor: pointer;
}
.mini:disabled { opacity: .35; cursor: not-allowed; }
.eqgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.eqslot {
  text-align: left; background: var(--panel2); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 9px; cursor: pointer; color: var(--ink);
}
.eqslot .eqname { display: block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.eqslot b { font-size: 12.5px; display: block; }
.eqslot i { font-size: 10.5px; color: var(--dim); font-style: normal; }
.eqslot.empty b { color: #5b6580; }

/* Nadirlik renkleri */
.r-common { border-color: color-mix(in srgb, var(--r-common) 45%, var(--line)); }
.r-uncommon { border-color: var(--r-uncommon); }
.r-rare { border-color: var(--r-rare); }
.r-epic { border-color: var(--r-epic); }
.r-legendary { border-color: var(--r-legendary); box-shadow: 0 0 14px -6px var(--r-legendary); }
.r-mythic { border-color: var(--r-mythic); box-shadow: 0 0 16px -5px var(--r-mythic); }

/* --- Envanter --- */
.inv-wrap { display: grid; gap: 14px; }
.icells, .mcells { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.icell, .mcell {
  text-align: left; background: var(--panel2); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px; cursor: pointer; color: var(--ink); transition: .14s;
}
.icell:hover, .mcell:hover { transform: translateY(-2px); background: #202742; }
.ic-slot { display: block; font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.ic-name { display: block; font-size: 12.5px; font-weight: 600; line-height: 1.2; margin: 2px 0; }
.ic-lv, .ic-price { font-size: 11px; color: var(--gold); }
.matbox { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.mat { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 3px 0; }
.mat i { width: 10px; height: 10px; border-radius: 3px; }
.mat b { margin-left: auto; }
.inv-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 12px; }

/* --- Item popup --- */
.itempop-layer { position: fixed; inset: 0; background: rgba(4,6,12,.6); display: grid; place-items: center; z-index: 50; padding: 20px; }
.itempop {
  width: min(400px, 100%); background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; padding: 18px; box-shadow: 0 24px 60px -24px #000;
}
.itempop h3 { font-size: 18px; margin-bottom: 4px; }
.istats { margin: 12px 0; display: flex; flex-direction: column; gap: 3px; }
.istat { display: flex; gap: 8px; font-size: 12.5px; border-bottom: 1px dashed var(--line); padding-bottom: 3px; }
.istat span { color: var(--dim); flex: 1; }
.istat b { color: var(--ink); }
.istat i { font-style: normal; font-weight: 700; font-size: 11.5px; }
.istat .up { color: var(--good); }
.istat .down { color: #ff7a8a; }
.ip-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

/* --- Market --- */
.shop-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.shop-top .btn { margin-left: 6px; }

/* --- Craft --- */
.craft { display: flex; flex-direction: column; gap: 10px; }
.recipe {
  display: flex; justify-content: space-between; align-items: center; gap: 14px;
  background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
.recipe h4 { margin: 0 0 3px; font-size: 15px; letter-spacing: 0; text-transform: none; color: var(--ink); }
.mats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; font-size: 11.5px; }
.mats .ok { color: var(--good); }
.mats .no { color: #ff7a8a; }

/* --- Görevler --- */
.quests { display: flex; flex-direction: column; gap: 10px; }
.questrow {
  display: flex; justify-content: space-between; align-items: center; gap: 14px;
  background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
.questrow h4 { margin: 0 0 4px; font-size: 14.5px; letter-spacing: 0; text-transform: none; color: var(--ink); }
.questrow .bar { margin-top: 7px; width: 240px; max-width: 44vw; height: 6px; }
.questrow .fill { background: linear-gradient(90deg, var(--accent), #fff); }
.questrow.done { border-color: var(--good); }

/* --- Çağlar --- */
.ages { display: flex; flex-direction: column; gap: 6px; }
.agerow {
  display: flex; align-items: center; gap: 14px; padding: 10px 12px;
  background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; opacity: .55;
}
.agerow.unlocked { opacity: 1; }
.agerow.current { border-color: var(--gold); box-shadow: 0 0 18px -10px var(--gold); }
.agemark {
  width: 38px; height: 38px; flex: none; border-radius: 10px; display: grid; place-items: center;
  font-family: var(--font-d); font-weight: 800; background: color-mix(in srgb, var(--c) 25%, #0b1020);
  border: 1px solid var(--c); color: var(--c);
}
.agerow h4 { margin: 0; font-size: 15px; letter-spacing: 0; text-transform: none; color: var(--ink); }
.agestate { margin-left: auto; font-size: 11px; color: var(--dim); }
.agefoot { margin-top: 14px; display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }

/* --- Depo --- */
.storage { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

/* --- PvP --- */
.pvp-panel { display: flex; flex-direction: column; gap: 16px; }
.rankbox {
  display: flex; align-items: center; gap: 18px; padding: 14px 18px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--c) 14%, var(--panel2)), var(--panel2));
  border: 1px solid var(--c); border-radius: 12px;
}
.rankname { font-family: var(--font-d); font-size: 24px; color: var(--c); }
.mmr { font-weight: 700; }
.wl { margin-left: auto; color: var(--dim); }
.pvp-actions { display: flex; flex-direction: column; gap: 14px; }
.duel { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.duel .row { display: flex; gap: 8px; margin: 8px 0; }
.mm-status { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--accent); }
.spin {
  width: 14px; height: 14px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--accent) 30%, transparent);
  border-top-color: var(--accent); animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.result { text-align: center; padding: 10px 0; }
.rbig { font-family: var(--font-d); font-size: 30px; margin-bottom: 16px; }
.result.win .rbig { color: var(--good); }
.result.lose .rbig { color: var(--danger); }
.rrew { display: flex; justify-content: center; gap: 26px; margin-bottom: 14px; }
.rrew div { display: flex; flex-direction: column; }
.rrew span { font-size: 11px; color: var(--dim); letter-spacing: .12em; text-transform: uppercase; }
.rrew b { font-size: 20px; font-family: var(--font-d); }
.result .ip-actions { justify-content: center; }

/* --- Yardım --- */
.keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px; font-size: 13px; }
.keys div { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; }
.keys b { color: var(--accent); margin-right: 6px; }

/* =============================================================
   4) RESPONSIVE / MOBİL
   ============================================================= */

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}


/* ===== KOMBO GÖSTERGESİ ===== */
#combo-ind{
  position:absolute; left:50%; top:26%; transform:translateX(-50%);
  text-align:center; pointer-events:none; z-index:6;
  font-family:'Cinzel',serif; letter-spacing:.06em;
  text-shadow:0 2px 14px rgba(0,0,0,.85);
}
#combo-ind b{ display:block; font-size:30px; color:var(--accent); line-height:1; }
#combo-ind span{ font-size:11px; opacity:.65; letter-spacing:.22em; text-transform:uppercase; }
#combo-ind.finish b{ font-size:38px; color:#ffd66b; }
#combo-ind.pop{ animation:comboPop .28s ease-out; }
@keyframes comboPop{
  0%{ transform:translateX(-50%) scale(.6); opacity:0; }
  55%{ transform:translateX(-50%) scale(1.16); opacity:1; }
  100%{ transform:translateX(-50%) scale(1); opacity:1; }
}

/* ===== İKSİR BUTONLARI ===== */
.skill.pot .count{ background:var(--pot); color:#0b0f18; font-weight:800; }
.skill.pot.empty{ opacity:.42; filter:grayscale(.7); }
.skill.auto{ min-width:56px; }
.skill.auto .count{ font-size:9px; letter-spacing:.08em; background:#2b3444; color:#8c97ab; }
.skill.auto.on .count{ background:#2f7d52; color:#dcffe9; }

/* ===== MARKET İKSİR TEZGÂHI ===== */
.potion-shop{ display:grid; gap:8px; margin-bottom:14px; }
.pot-row{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:10px 12px; border-radius:10px;
  background:linear-gradient(90deg, color-mix(in srgb, var(--pot) 14%, transparent), transparent 65%);
  border:1px solid color-mix(in srgb, var(--pot) 35%, transparent);
}
.pot-info b{ display:block; color:var(--pot); font-size:14px; }
.pot-info span{ font-size:11.5px; opacity:.7; }
.pot-buy{ display:flex; gap:6px; flex-wrap:wrap; }
.btn.small{ padding:6px 10px; font-size:11.5px; }

/* ===== EFSUN ROZETİ ===== */
.ench{ font-size:11.5px; margin:-4px 0 8px; }
.ench.yes{ color:#c9a6ff; }
.ench.no{ color:#7b8496; }
.ench-dot{ color:#c9a6ff; font-style:normal; }

@media (max-width:860px){
  #combo-ind b{ font-size:24px; }
  .pot-row{ flex-direction:column; align-items:stretch; }
}

/* ===== IRK PASİFİ ===== */
.race-passive{
  margin:10px 0 14px; padding:10px 12px; border-radius:10px;
  border:1px solid color-mix(in srgb, var(--c) 32%, transparent);
  background:linear-gradient(90deg, color-mix(in srgb, var(--c) 12%, transparent), transparent 70%);
}
.race-passive b{ display:block; color:var(--c); font-size:13px; margin-bottom:3px; }
.race-passive span{ font-size:11.5px; opacity:.75; line-height:1.5; }
.pick-card .bonus.passive{ display:block; margin-top:6px; opacity:.62; font-size:10.5px; line-height:1.45; }

/* ===== MARKET KADEME SEKMELERİ ===== */
.tier-tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
.tier-tab{
  flex:1 1 110px; padding:7px 9px; border-radius:9px; cursor:pointer; text-align:left;
  background:#141a26; border:1px solid #263043; color:#e8e0cd;
  font-family:'Barlow',system-ui,sans-serif; transition:.15s;
}
.tier-tab b{ display:block; font-size:12px; color:var(--tc); }
.tier-tab span{ font-size:10px; opacity:.6; letter-spacing:.04em; }
.tier-tab:hover{ border-color:var(--tc); }
.tier-tab.on{ background:linear-gradient(180deg, color-mix(in srgb, var(--tc) 22%, transparent), transparent); border-color:var(--tc); }
.tier-tab.locked{ opacity:.5; }
.tier-tab.locked b::after{ content:' 🔒'; font-size:10px; }
.tier-note{ font-size:11.5px; opacity:.72; margin:0 0 12px; }
.tier-note.warn{ color:#ffcf7a; opacity:.95; }
.mcell.ench{ box-shadow:inset 0 0 0 1px rgba(201,166,255,.35); }
.istat.rare b{ color:#c9a6ff; }
.rare-tag{
  font-style:normal; font-size:8.5px; letter-spacing:.1em; text-transform:uppercase;
  color:#c9a6ff; border:1px solid rgba(201,166,255,.4); border-radius:4px; padding:0 3px; margin-left:4px;
}

/* ===== ÜZERİNDEKİ EKİPMAN (envanter) ===== */
.worn-box{ margin-bottom:14px; }
.worn-box h4{ margin:0 0 8px; }
.worn-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:8px; }
.worn{
  padding:9px 10px; border-radius:10px; text-align:left; cursor:pointer;
  background:#111725; border:1px solid #26304a; transition:.15s;
}
.worn:hover{ border-color:#4a5a80; transform:translateY(-1px); }
.worn.empty{ opacity:.45; cursor:default; }
.worn .wslot{ display:block; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; opacity:.55; }
.worn b{ display:block; font-size:12.5px; margin:2px 0 3px; line-height:1.25; }
.worn .wmeta{ display:block; font-size:10px; opacity:.55; margin-bottom:5px; }
.wstats{ display:flex; flex-wrap:wrap; gap:3px 8px; }
.wstats i{ font-style:normal; font-size:10.5px; opacity:.78; }
.wstats i b{ display:inline; font-size:10.5px; color:#e8e0cd; }
.wstats i.rare, .wstats i.rare b{ color:#c9a6ff; opacity:1; }
.worn.r-uncommon{ border-color:#3f6b40; } .worn.r-rare{ border-color:#2f5f96; }
.worn.r-epic{ border-color:#6b40a0; } .worn.r-legendary{ border-color:#a06a20; }
.worn.r-mythic{ border-color:#a03048; }

/* ===== YETENEK PANELİ ===== */
.skills-wrap{ display:flex; flex-direction:column; gap:12px; }
.skgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; }
.skcard{
  padding:12px; border-radius:12px; background:#111725;
  border:1px solid color-mix(in srgb, var(--c) 28%, #26304a);
}
.skhead{ display:flex; align-items:center; gap:9px; margin-bottom:7px; }
.skkey{
  width:26px; height:26px; flex:0 0 26px; display:grid; place-items:center;
  border-radius:7px; background:color-mix(in srgb, var(--c) 22%, transparent);
  border:1px solid var(--c); color:var(--c); font-weight:800; font-size:13px;
}
.skhead b{ display:block; font-family:'Cinzel',serif; font-size:13.5px; color:var(--c); }
.skhow{ font-size:11.5px; margin:0 0 4px; line-height:1.5; }
.skrows{ margin:8px 0; border-top:1px solid #1e2637; padding-top:7px; }
.skrow{ display:flex; justify-content:space-between; gap:8px; font-size:11px; padding:2px 0; }
.skrow span{ opacity:.6; }
.skcard h5{ margin:8px 0 4px; font-size:10px; letter-spacing:.14em; text-transform:uppercase; opacity:.5; }
.skeff{ margin:0; padding-left:15px; }
.skeff li{ font-size:11px; line-height:1.55; opacity:.85; }
.skinfo{
  padding:11px 13px; border-radius:11px;
  border:1px solid color-mix(in srgb, var(--c) 30%, transparent);
  background:linear-gradient(90deg, color-mix(in srgb, var(--c) 12%, transparent), transparent 70%);
}
.skinfo b{ color:var(--c); font-size:13px; }
.skinfo p{ margin:4px 0 0; font-size:11.5px; line-height:1.6; opacity:.82; }


/* =============================================================
   MOBİL — tam ekran sığdırma ve dokunmatik kontroller
   ============================================================= */

/* Tarayıcı çubukları yüzünden kesilmesin: dvh + güvenli alan */
html, body { height: 100%; height: 100dvh; overscroll-behavior: none; }
body { position: fixed; inset: 0; width: 100%; touch-action: manipulation; }
#screen-game { inset: 0; height: 100dvh; }
#game { touch-action: none; }
#hud { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

/* Karakter oluşturma ekranı küçük ekranda kaydırılabilir */
#screen-create { overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* --- Dokunmatik aksiyon tuşları --- */
#touch-actions{
  position:absolute; right:calc(16px + env(safe-area-inset-right));
  bottom:calc(104px + env(safe-area-inset-bottom));
  display:none; align-items:flex-end; gap:10px; pointer-events:auto; z-index:8;
}
.tbtn{
  border-radius:50%; border:1px solid var(--line); background:rgba(16,21,36,.86);
  color:var(--ink); display:grid; place-items:center; touch-action:none;
  font-size:22px; font-weight:700; -webkit-user-select:none; user-select:none;
  box-shadow:0 6px 18px -8px #000;
}
.tbtn.big{ width:86px; height:86px; font-size:34px; border-color:var(--accent); color:var(--accent);
  background:radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--accent) 26%, transparent), rgba(16,21,36,.9)); }
.tbtn.small{ width:54px; height:54px; font-size:18px; }
.tbtn:active{ transform:scale(.93); filter:brightness(1.25); }

/* --- Mobil menü düğmesi --- */
#menu-toggle{
  position:absolute; top:calc(10px + env(safe-area-inset-top)); right:calc(10px + env(safe-area-inset-right));
  display:none; width:42px; height:42px; border-radius:11px; z-index:12;
  background:rgba(12,16,28,.85); border:1px solid var(--line); color:var(--ink); font-size:19px;
  pointer-events:auto;
}

/* Dokunmatik cihazlarda joystick her zaman görünür */
body.is-touch #joystick,
body.is-touch #touch-actions{ display:flex; }
body.is-touch #joystick{ display:block; }
body.is-touch #game{ cursor:default; }

/* ================= DAR EKRAN DÜZENİ ================= */
@media (max-width: 900px), (pointer: coarse) and (max-width: 1100px) {
  .char-grid, .storage, .inv-wrap { grid-template-columns: 1fr; }

  /* Sol üst: küçük oyuncu paneli */
  .hud-player{ top:calc(8px + env(safe-area-inset-top)); left:calc(8px + env(safe-area-inset-left));
    min-width:0; width:min(52vw,240px); gap:7px; padding:6px 8px; transform:scale(.92); transform-origin:top left; }

  /* Üst: kaynak barı küçülür, menü gizlenip ☰ ile açılır */
  .hud-top{ top:calc(74px + env(safe-area-inset-top)); left:calc(8px + env(safe-area-inset-left)); transform:none;
    padding:4px 8px; font-size:11.5px; gap:4px; border-radius:10px; }
  .res.age{ display:none; }
  #menu-toggle{ display:block; }
  .menu{
    position:fixed; top:calc(58px + env(safe-area-inset-top)); right:calc(10px + env(safe-area-inset-right));
    flex-direction:column; gap:4px; margin:0; padding:8px; border:1px solid var(--line);
    background:rgba(12,16,28,.95); border-radius:12px; z-index:11;
    display:none; box-shadow:0 20px 40px -20px #000;
  }
  body.menu-open .menu{ display:flex; }
  .menu button{ font-size:14px; padding:10px 14px; text-align:left; min-width:132px; }

  /* Sağ: mini harita küçülür, görev takibi gizlenir */
  .hud-right{ top:calc(8px + env(safe-area-inset-top)); right:calc(58px + env(safe-area-inset-right)); width:96px; }
  #minimap{ width:88px; height:88px; }
  #zone-name{ font-size:10.5px; margin-top:3px; }
  #quest-tracker{ display:none; }

  /* Yetenek çubuğu: en altta tam genişlik, yatay kaydırmalı tek sıra */
  #skillbar{
    left:0; right:0; transform:none; justify-content:flex-start;
    bottom:calc(6px + env(safe-area-inset-bottom));
    padding:0 10px; gap:6px; flex-wrap:nowrap;
    overflow-x:auto; overflow-y:hidden; scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  #skillbar::-webkit-scrollbar{ display:none; }
  .skill{ width:56px; height:52px; flex:0 0 auto; padding:4px; border-radius:9px; }
  .skill .sname{ font-size:9px; }
  .skill .key{ font-size:8.5px; top:3px; left:4px; }
  .skill .mana, .skill .count{ font-size:9px; top:3px; right:4px; }
  .skill.util{ width:48px; }
  .skill.auto{ width:54px; min-width:0; }
  body.is-touch #btn-dash{ display:none; }        /* ayrı dash tuşu var */

  /* Joystick sol altta, aksiyon tuşları sağ altta — yetenek çubuğunun üstünde */
  #joystick{ bottom:calc(72px + env(safe-area-inset-bottom)); left:calc(16px + env(safe-area-inset-left));
    width:104px; height:104px; }
  #touch-actions{ bottom:calc(72px + env(safe-area-inset-bottom)); right:calc(14px + env(safe-area-inset-right)); }

  #toasts{ bottom:calc(190px + env(safe-area-inset-bottom)); right:10px; }
  .toast{ font-size:11.5px; padding:6px 10px; max-width:62vw; }
  #interact-hint{ bottom:calc(192px + env(safe-area-inset-bottom)); }
  #combo-ind{ top:16%; }
  #combo-ind b{ font-size:26px; }
  #boss-bar, #pvp-bar{ top:calc(96px + env(safe-area-inset-top)); width:min(88vw,420px); }

  /* Paneller tam ekran ve kaydırılabilir */
  #modal-layer{ padding:0; }
  .modal, .modal.wide{
    width:100%; max-width:100%; height:100dvh; max-height:100dvh; border-radius:0; border:none;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  }
  .modal-body{ padding:12px 12px 24px; -webkit-overflow-scrolling:touch; }
  .modal-head{ padding:10px 12px; }
  .modal-head h2{ font-size:16px; }
  #modal-close{ width:40px; height:40px; font-size:20px; }

  /* Panel içi ızgaralar tek/iki sütuna */
  .icells{ grid-template-columns:repeat(auto-fill,minmax(46%,1fr)); }
  .worn-grid, .skgrid, .eqgrid{ grid-template-columns:1fr; }
  .mcells{ grid-template-columns:repeat(auto-fill,minmax(46%,1fr)); }
  .tier-tab{ flex:1 1 46%; }
  .itempop{ width:min(94vw,420px); max-height:86dvh; overflow-y:auto; }
  .btn{ padding:11px 14px; }          /* dokunmatik hedef büyütme */
  .mini{ min-width:38px; min-height:32px; }

  /* Karakter oluşturma dar ekranda tek sütun */
  .picks.two, .picks.three{ grid-template-columns:1fr; }
  .create-wrap{ padding:18px 14px calc(28px + env(safe-area-inset-bottom)); }
  .create-head h1{ font-size:30px; }
}

/* =============================================================
   YATAY (landscape) TELEFON
   Dikey alan çok az; ekran dört köşeye bölünür ve hiçbir öğe
   bir diğerinin üstüne binmez.
     sol üst  : oyuncu paneli + kaynaklar
     sağ üst  : ☰ menü, altında mini harita
     sol alt  : joystick        sağ alt : aksiyon tuşları
     alt orta : yetenek çubuğu (ikisinin arasında)
   ============================================================= */
@media (max-height: 520px) and (pointer: coarse) {
  /* --- sol üst --- */
  .hud-player{
    top:calc(6px + env(safe-area-inset-top)); left:calc(6px + env(safe-area-inset-left));
    transform:scale(.76); transform-origin:top left; width:min(46vw,250px);
  }
  /* oyuncu paneli .76 ölçekte ~190px genişlik + ~50px yükseklik kaplar;
     kaynak barı onun SAĞINA yerleşir, altına değil (üst üste binmesin) */
  .hud-top{
    top:calc(6px + env(safe-area-inset-top));
    left:calc(202px + env(safe-area-inset-left));
    right:auto; bottom:auto; transform:none;
    padding:3px 7px; font-size:10.5px; gap:3px; border-radius:9px;
  }

  /* --- sağ üst --- */
  #menu-toggle{ width:38px; height:38px; font-size:17px;
    top:calc(6px + env(safe-area-inset-top)); right:calc(6px + env(safe-area-inset-right)); }
  .hud-right{ top:calc(50px + env(safe-area-inset-top)); right:calc(6px + env(safe-area-inset-right)); width:78px; }
  #minimap{ width:70px; height:70px; }
  #zone-name{ font-size:9px; margin-top:2px; }
  .minibox{ padding:5px; }
  .menu{ top:calc(50px + env(safe-area-inset-top)); max-height:calc(100dvh - 70px); overflow-y:auto; }
  .menu button{ font-size:12.5px; padding:7px 11px; min-width:112px; }

  /* --- sol alt / sağ alt --- */
  #joystick{ width:86px; height:86px;
    bottom:calc(52px + env(safe-area-inset-bottom)); left:calc(10px + env(safe-area-inset-left)); }
  #touch-actions{ bottom:calc(52px + env(safe-area-inset-bottom));
    right:calc(10px + env(safe-area-inset-right)); gap:8px; }
  .tbtn.big{ width:64px; height:64px; font-size:25px; }
  .tbtn.small{ width:42px; height:42px; font-size:15px; }

  /* --- alt orta: yetenek çubuğu joystick ile tuşların ARASINDA --- */
  #skillbar{
    bottom:calc(5px + env(safe-area-inset-bottom));
    left:calc(106px + env(safe-area-inset-left));
    right:calc(180px + env(safe-area-inset-right));
    padding:0; gap:5px; justify-content:flex-start;
  }
  .skill{ width:46px; height:42px; padding:3px; }
  .skill .sname{ font-size:8px; }

  /* --- bildirimler ve ipuçları: boş kalan orta şeride --- */
  #toasts{ bottom:calc(126px + env(safe-area-inset-bottom)); right:calc(10px + env(safe-area-inset-right));
    top:auto; max-width:32vw; }
  .toast{ font-size:10.5px; padding:5px 9px; max-width:32vw; }
  /* etkileşim ipucu joystick ile tuşların arasındaki boşlukta */
  #interact-hint{ bottom:calc(56px + env(safe-area-inset-bottom)); }
  /* kombo göstergesi karakterin üstünde kalsın (alt şeritle karışmasın) */
  #combo-ind{ top:28%; bottom:auto; }
  #combo-ind b{ font-size:20px; }
  #combo-ind.finish b{ font-size:25px; }
  /* üst şeridin (oyuncu paneli + kaynaklar) hemen ALTINDA, ortada */
  #boss-bar, #pvp-bar{
    top:calc(58px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    width:min(44vw,320px); padding:5px 10px; font-size:11px;
  }
  .bb-name{ font-size:12px; margin-bottom:3px; }
  .pvp-side{ font-size:11px; }

  /* --- paneller: yatayda iki sütun daha verimli --- */
  .modal-head{ padding:7px 12px; }
  .modal-head h2{ font-size:15px; }

/* ===== js/utils.js ===== */
/* =============================================================
   utils.js — matematik, rastgelelik, biçimlendirme, event bus
   ============================================================= */

const U = {
  clamp(v, a, b) { return v < a ? a : (v > b ? b : v); },
  lerp(a, b, t) { return a + (b - a) * t; },
  rand(a = 0, b = 1) { return a + Math.random() * (b - a); },
  randInt(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); },
  chance(p) { return Math.random() < p; },
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },

  weightedPick(list, weightKey = 'weight') {
    let total = 0;
    for (const it of list) total += it[weightKey];
    let r = Math.random() * total;
    for (const it of list) { r -= it[weightKey]; if (r <= 0) return it; }
    return list[list.length - 1];
  },

  dist(ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; return Math.sqrt(dx * dx + dy * dy); },
  dist2(ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; },
  angle(ax, ay, bx, by) { return Math.atan2(by - ay, bx - ax); },

  uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); },

  fmt(n) {
    n = Math.floor(n);
    return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  },
  pct(v, d = 0) { return (v * 100).toFixed(d) + '%'; },

  /* Stat değerini okunur biçime çevirir */
  fmtStat(key, v) {
    const pctKeys = ['critChance', 'critDamage', 'penetration', 'elementDamage', 'elementRes',
                     'resSu', 'resAtes', 'dmgBoss', 'dmgMonster', 'dmgPlayer', 'dmgStone'];
    if (pctKeys.includes(key)) return (v >= 0 ? '+' : '') + (v * 100).toFixed(1) + '%';
    if (key === 'attackSpeed') return (v >= 0 ? '+' : '') + v.toFixed(2);
    if (key === 'moveSpeed' || key === 'hpRegen') return (v >= 0 ? '+' : '') + v.toFixed(1);
    return (v >= 0 ? '+' : '') + Math.round(v);
  },

  statName(key) {
    const map = {
      maxHp: 'Can', hpRegen: 'HP Yenilenmesi', attack: 'Saldırı Gücü', magic: 'Büyü Gücü',
      defense: 'Savunma', attackSpeed: 'Saldırı Hızı', moveSpeed: 'Koşu Hızı',
      critChance: 'Kritik Şans', critDamage: 'Kritik Hasar', penetration: 'Delici Vuruş',
      range: 'Menzil', elementDamage: 'Element Hasarı', elementRes: 'Element Direnci',
      resSu: 'Suya Karşı Dayanıklılık', resAtes: 'Ateşe Karşı Dayanıklılık',
      dmgBoss: "Boss'a Karşı Güçlü", dmgMonster: 'Canavara Karşı Güçlü',
      dmgPlayer: 'Oyuncuya Karşı Güçlü', dmgStone: 'Maden Taşına Karşı Güçlü'
    };
    return map[key] || key;
  },

  /* Basit yayın-abone sistemi (görev takibi, UI güncellemesi) */
  bus: {
    _h: {},
    on(evt, fn) { (this._h[evt] = this._h[evt] || []).push(fn); },
    emit(evt, data) { (this._h[evt] || []).forEach(fn => fn(data)); }
  },

  /* Nokta bir daire içinde mi */
  inCircle(px, py, cx, cy, r) { return U.dist2(px, py, cx, cy) <= r * r; },

  /* Açı farkı (-PI..PI) */
  angleDiff(a, b) {
    let d = b - a;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return d;
  },

  now() { return performance.now() / 1000; }
};

  KEYS: ['maxHp', 'hpRegen', 'attack', 'magic', 'defense', 'attackSpeed', 'moveSpeed',
         'critChance', 'critDamage', 'penetration', 'range', 'elementDamage', 'elementRes',
         'resSu', 'resAtes', 'dmgBoss', 'dmgMonster', 'dmgPlayer', 'dmgStone'],

  empty() {
    const s = {};
    for (const k of this.KEYS) s[k] = 0;
    return s;
  },

  softCap(key, value) {
    const c = GameData.SOFTCAP[key];
    if (!c) return value;
    let v = value;
    if (v > c.soft) v = c.soft + (v - c.soft) * c.rate;
    return Math.min(v, c.hard);
  },

  /* Ekipmandan gelen toplam statlar */
  fromEquipment(equipment) {
    const s = this.empty();
    for (const slot of GameData.SLOTS) {
      const item = equipment[slot.key];
      if (!item) continue;
      for (const [k, v] of Object.entries(item.stats)) {
        if (s[k] === undefined) s[k] = 0;
        s[k] += v;
      }
    }
    return s;
  },

  /* Dağıtılan stat puanlarından gelen katkı */
  fromAlloc(alloc) {
    const s = this.empty();
    for (const a of GameData.ALLOC) {
      const pts = alloc[a.key] || 0;
      s[a.key] += pts * a.per;
    }
    return s;
  },

  /* Bir karakterin nihai statlarını hesaplar */
  compute(ch) {
    const cls = GameData.CLASSES[ch.cls];
    const race = GameData.RACES[ch.race];
    const s = this.empty();

    // 1) taban + level büyümesi
    const lv = ch.level - 1;
    for (const [k, v] of Object.entries(cls.base)) s[k] = v;
    for (const [k, v] of Object.entries(cls.growth)) s[k] += v * lv;
    s.hpRegen += 2 + lv * 0.22;

    // 2) dağıtılan puanlar
    const al = this.fromAlloc(ch.alloc || {});
    for (const k of this.KEYS) s[k] += al[k] || 0;

    // 3) ekipman
    const eq = this.fromEquipment(ch.equipment || {});
    for (const k of this.KEYS) s[k] += eq[k] || 0;

    // 4) ırk çarpanları
    const b = race.bonus;
    if (b.attack) s.attack *= (1 + b.attack), s.magic *= (1 + b.attack);
    if (b.defense) s.defense *= (1 + b.defense);
    if (b.hpRegen) s.hpRegen *= (1 + b.hpRegen);
    if (b.moveSpeed) s.moveSpeed *= (1 + b.moveSpeed);
    if (b.critChance) s.critChance += b.critChance;
    if (b.critDamage) s.critDamage += b.critDamage;
    if (b.elementDamage) s.elementDamage += b.elementDamage;
    if (b.elementRes) s.elementRes += b.elementRes;
    if (b.maxHp) s.maxHp *= (1 + b.maxHp);
    if (b.attackSpeed) s.attackSpeed *= (1 + b.attackSpeed);
    if (b.resSu) s.resSu += b.resSu;             // ırkın doğal element dayanıklılığı
    if (b.resAtes) s.resAtes += b.resAtes;

    // 5) soft-cap
    for (const k of this.KEYS) s[k] = this.softCap(k, s[k]);

    // 6) yuvarlama
    s.maxHp = Math.round(s.maxHp);
    s.attack = Math.round(s.attack);
    s.magic = Math.round(s.magic);
    s.defense = Math.round(s.defense);
    return s;
  },

  /* Ekipman gücü — matchmaking ve öneri için tek sayı */
  powerOf(s) {
    return Math.round(
      s.maxHp * 0.35 + s.attack * 4 + s.magic * 4 + s.defense * 3 +
      s.critChance * 900 + s.critDamage * 260 + s.penetration * 700 +
      s.attackSpeed * 220 + s.moveSpeed * 40
    );
  },

  power(ch) { return this.powerOf(this.compute(ch)); },

  /* --- GÜÇ MANTIĞI ---
     etkiliCan = can / (1 - savunma kesintisi) · savaşPuanı = güç × etkiliCan
     Sınıflar bu puanı farklı dağıtır: savaşçı cana, okçu hasara, büyücü alana. */
  effectiveHp(s) {
    const K = GameData.POWER_MODEL.defenseK;
    const dr = s.defense / (s.defense + K);
    return Math.round(s.maxHp / (1 - dr));
  },

  battleScore(ch) {
    const s = this.compute(ch);
    const dmg = Math.max(s.attack, s.magic) * Math.max(0.4, s.attackSpeed) *
                (1 + U.clamp(s.critChance, 0, 1) * Math.max(0, s.critDamage - 1));
    return Math.round(dmg * this.effectiveHp(s) / 1000);
  },

  /* Level için gereken XP */
  xpNeed(level) { return GameData.BALANCE.xpCurve(level); }
};

/* ===== js/combat.js ===== */
/* =============================================================
   combat.js — Hasar hesaplama (modüler, tek noktadan değiştirilebilir)

   Final = Güç × Skill Çarpanı
           → Savunma Azaltma (delici sonrası)
           → Element Modifikatörü (avantaj − direnç)
           → Kritik
           → Sapma
   Bu fonksiyon saf (pure) yazıldı: ileride Node sunucusuna
   aynen taşınabilir. Client asla hasar "kararı" vermez.
   ============================================================= */

const Combat = {

  /* attacker/defender: { stats, level, element } */
  calc(attacker, defender, opts = {}) {
    const B = GameData.BALANCE;
    const A = attacker.stats, D = defender.stats;

    const mult = opts.mult != null ? opts.mult : 1;
    const useMagic = opts.magic === true;
    const power = useMagic ? A.magic : A.attack;

    let dmg = power * mult;

    // --- Savunma azaltma (delici vuruş savunmanın bir kısmını yok sayar)
    const pen = U.clamp((A.penetration || 0) + (opts.bonusPen || 0), 0, 0.85);
    const effDef = Math.max(0, (D.defense || 0) * (1 - pen));
    const k = B.defenseK + B.defensePerLevel * (attacker.level || 1);
    const mitigation = effDef / (effDef + k);
    dmg *= (1 - mitigation);

    // --- Element modifikatörü
    let elemMod = 1 + (A.elementDamage || 0);
    if (attacker.element && defender.element && attacker.element !== defender.element) {
      elemMod += B.elementAdvantage;
    }
    elemMod -= (D.elementRes || 0);
    // Elemente ÖZEL dayanıklılık: saldıranın elementine göre ayrı direnç
    if (attacker.element === 'su')   elemMod -= (D.resSu || 0);
    if (attacker.element === 'ates') elemMod -= (D.resAtes || 0);
    dmg *= Math.max(0.15, elemMod);

    // --- Hedef türüne karşı güç (boss / canavar / oyuncu)
    const kind = defender.kind || 'monster';
    const kindKey = kind === 'boss' ? 'dmgBoss' : kind === 'player' ? 'dmgPlayer' : kind === 'stone' ? 'dmgStone' : 'dmgMonster';
    dmg *= (1 + (A[kindKey] || 0));

    // --- Kritik
    let crit = false;
    let critChance = U.clamp(A.critChance || 0, 0, 1);
    // Ateş ırkı pasifi: yanan hedefe karşı ek kritik şansı
    if (attacker.element === 'ates' && defender.burning) {
      critChance = U.clamp(critChance + (GameData.RACES.ates.passive.critVsBurning || 0), 0, 1);
    }
    if (opts.forceCrit) crit = true;
    else crit = Math.random() < critChance;
    if (crit) dmg *= (A.critDamage || 1.5);

    // --- Delici görsel bildirimi (savunmanın %20+'ını yok saydıysa)
    const penetrated = pen >= 0.20 && (D.defense || 0) > 0;

    // --- Sapma
    dmg *= U.rand(1 - B.variance, 1 + B.variance);

    return {
      damage: Math.max(1, Math.round(dmg)),
      crit,
      penetrated,
      element: attacker.element || null
    };
  },

  /* Yaratıklar için basitleştirilmiş saldırı (aynı formül, monster statları) */
  monsterStats(m, level, ageMul) {
    const g = 1 + (level - 1) * 0.11;
    const am = GameData.BALANCE.monsterAtkMul;
    return {
      maxHp: Math.round(m.hp * g * ageMul),
      attack: Math.round(m.atk * g * ageMul * am),
      magic: Math.round(m.atk * g * ageMul * am),
      defense: Math.round(m.def * g * ageMul),
      attackSpeed: m.aspd,
      moveSpeed: m.spd,
      critChance: 0.05,
      critDamage: 1.5,
      penetration: 0.05,
      range: m.range,
      elementDamage: 0,
      elementRes: 0.05,
      hpRegen: 0
    };
  }
};

/* ===== js/loot.js ===== */
/* =============================================================
   loot.js — Item üretimi, nadirlik, fiyatlama, market ve craft
   ============================================================= */

const Loot = {

  rarityById(id) { return GameData.RARITY.find(r => r.id === id); },

  /* ---- Kuşam kademesi (level aralığına göre ayrı kıyafet setleri) ---- */
  tierOf(level) {
    const T = GameData.GEAR_TIERS;
    for (const t of T) if (level >= t.min && level <= t.max) return t;
    return level < T[0].min ? T[0] : T[T.length - 1];
  },
  tierById(id) { return GameData.GEAR_TIERS.find(t => t.id === id) || GameData.GEAR_TIERS[0]; },

  rollRarity(bonus = 0) {
    // bonus: elite/boss için nadirlik ağırlığını kaydırır
    const list = GameData.RARITY.map(r => ({
      ...r,
      w: r.weight * (r.mult > 1.2 ? (1 + bonus * (r.mult - 1)) : 1)
    }));
    return U.weightedPick(list, 'w');
  },

  /* Ana item üretici */
  generate(opts = {}) {
    const ilvl = U.clamp(Math.round(opts.ilvl || 1), 1, 100);
    const slot = opts.slot || U.pick(GameData.SLOTS).key;
    const rarity = opts.rarity ? this.rarityById(opts.rarity) : this.rollRarity(opts.rarityBonus || 0);
    const race = opts.race || U.pick(['su', 'ates']);
    const cls = opts.cls || null;

    const tier = opts.tier ? this.tierById(opts.tier) : this.tierOf(ilvl);
    const tMul = tier.statMul;

    const stats = {};
    const main = GameData.SLOT_MAIN[slot];

    /* Silahın ana statı sınıfa göre ölçeklenir (güç mantığı):
       savaşçının ağır silahı en yüksek, büyücünün asası en düşük ham saldırı verir —
       büyücü hasarını asa yerine büyü gücü statından alır. */
    let classMul = 1;
    let mainStat = main.stat;
    if (slot === 'weapon') {
      const role = GameData.POWER_MODEL.roles[cls];
      classMul = role ? role.weaponMul : 1;
      if (cls === 'buyucu') mainStat = 'magic';       // asa büyü gücü verir
    }
    stats[mainStat] = Math.round((main.base + main.per * ilvl) * rarity.mult * tMul * classMul * U.rand(0.9, 1.12));

    // Asa aynı zamanda az miktarda fiziksel saldırı verir
    if (slot === 'weapon' && cls === 'buyucu') {
      stats.attack = Math.round(stats.magic * 0.30);
    }

    /* --- EFSUN ---
       Efsunsuz item yalnızca ana statını taşır. Efsunlu item ek stat alır.
       opts.enchant: true/false verilirse zorlanır, verilmezse şansa bağlı. */
    const E = GameData.ENCHANT;
    const enchanted = opts.enchant !== undefined
      ? !!opts.enchant
      : U.chance(opts.enchantChance != null ? opts.enchantChance : E.baseChance);

    const pool = GameData.AFFIXES.filter(a => a.key !== mainStat);
    const used = new Set();
    const affixCount = enchanted ? rarity.affixes : 0;
    for (let i = 0; i < affixCount; i++) {
      let a = U.pick(pool);
      let guard = 0;
      while (used.has(a.key) && guard++ < 12) a = U.pick(pool);
      used.add(a.key);
      const val = (a.base + a.per * ilvl) * rarity.mult * tMul * U.rand(0.85, 1.15);
      stats[a.key] = (stats[a.key] || 0) + (a.fmt === 'flat' ? Math.round(val) : Math.round(val * 1000) / 1000);
    }

    /* --- NADİR EFSUNLAR (delici, dayanıklılık, türe karşı güç) ---
       Aynı taban eşya markette de satılır; farkı buradaki efsun havuzudur. */
    let rareCount = enchanted ? (GameData.RARE_AFFIX_COUNT[rarity.id] || 0) : 0;
    if (opts.rareAffixes != null) rareCount = opts.rareAffixes;
    const rareUsed = [];
    for (let i = 0; i < rareCount; i++) {
      const pool = GameData.RARE_AFFIXES.filter(a => !rareUsed.includes(a.key));
      if (!pool.length) break;
      const a = U.weightedPick(pool, 'weight');
      rareUsed.push(a.key);
      const val = (a.base + a.per * ilvl) * (0.85 + rarity.mult * 0.35) * tMul * U.rand(0.9, 1.15);
      stats[a.key] = (stats[a.key] || 0) + Math.round(val * 1000) / 1000;
    }

    let name = this.makeName(slot, rarity, race, cls, tier);
    if (enchanted) name = GameData.ENCHANT.prefix + ' ' + name;
    const item = {
      uid: U.uid(),
      name, slot, ilvl,
      enchanted,
      gift: !!opts.gift,
      tier: tier.id,
      tierName: tier.name,
      rareAffixes: rareUsed,
      rarity: rarity.id,
      reqLevel: tier.min,                 // kuşam kademesinin alt sınırı
      age: this.ageOfLevel(ilvl),
      stats,
      price: 0
    };
    item.price = Math.round(this.price(item) * tier.priceMul *
      (enchanted ? GameData.ENCHANT.priceMul : 1) * (1 + rareUsed.length * 0.35));
    return item;
  },

  ageOfLevel(lv) {
    let a = 1;
    for (const age of GameData.AGES) if (lv >= age.reqLevel) a = age.id;
    return a;
  },

  makeName(slot, rarity, race, cls, tier) {
    const set = (tier || this.tierOf(1)).sets[race];       // kademe seti: her level aralığı ayrı kıyafet
    if (slot === 'weapon') {
      const base = cls ? U.pick(GameData.WEAPON_NAMES[cls]) : U.pick(GameData.WEAPON_NAMES.savasci);
      return `${set} ${base}`;
    }
    const slotName = GameData.SLOTS.find(s => s.key === slot).name;
    if (rarity.mult >= 1.85) return `${set} ${U.pick(GameData.ARMOR_SUFFIX)} ${slotName}`;
    return `${set} ${slotName}`;
  },

  price(item) {
    const r = this.rarityById(item.rarity);
    return Math.round((26 + item.ilvl * 14) * r.mult * r.mult * U.rand(0.95, 1.08));
  },

  sellValue(item) { return Math.max(1, Math.round(item.price * GameData.BALANCE.goldSellRate)); },

  /* Bir itemin toplam gücü — "daha iyi mi?" karşılaştırması için */
  score(item, cls) {
    const w = {
      maxHp: 0.35, attack: cls === 'buyucu' ? 1.2 : 4, magic: cls === 'buyucu' ? 4 : 1.2,
      defense: 3, critChance: 900, critDamage: 260, penetration: 700,
      attackSpeed: 220, moveSpeed: 40, hpRegen: 12, elementDamage: 500, elementRes: 400
    };
    let s = 0;
    for (const [k, v] of Object.entries(item.stats)) s += (w[k] || 1) * v;
    return Math.round(s);
  },

  /* Market stoğu üretir */
  /* Market stoğu — bir KADEME için üretir (10-20, 20-40, ... ayrı raflar).
     Her rafta hem efsunsuz hem efsunlu eşya bulunur. */
  makeStock(tierId, race, cls, count = 9) {
    const tier = this.tierById(tierId);
    const stock = [];
    for (let i = 0; i < count; i++) {
      const ilvl = U.clamp(U.randInt(tier.min, Math.min(tier.max, tier.min + 12)), 1, 100);
      const slot = GameData.SLOTS[i % GameData.SLOTS.length].key;
      const rarity = U.weightedPick(GameData.RARITY.slice(0, 4).map(r => ({ ...r, w: r.weight })), 'w').id;
      stock.push(this.generate({
        ilvl, slot, rarity, race, cls, tier: tier.id,
        enchant: i % 2 === 0                 // bir efsunsuz, bir efsunlu
      }));
    }
    return stock;
  },

  /* Yaratık ölünce düşen ganimet */
  rollDrop(monster, monsterLevel, player) {
    const out = { items: [], mats: {} };
    const tier = monster.tier;
    const chanceItem = tier === 'boss' ? 1 : tier === 'stone' ? 1 : tier === 'elite' ? 0.35 : 0.11;
    const rarityBonus = tier === 'boss' ? 3.5 : tier === 'stone' ? 2.4 : tier === 'elite' ? 1.2 : 0;
    const gearTier = this.tierOf(player.level).id;          // ganimet oyuncunun kademesinden

    if (U.chance(chanceItem)) {
      out.items.push(this.generate({
        ilvl: U.clamp(player.level + U.randInt(-1, 2), 1, 100), tier: gearTier,
        race: player.race, cls: player.cls, rarityBonus,
        enchantChance: tier === 'stone' ? 0.75 : tier === 'elite' ? 0.60 : GameData.ENCHANT.baseChance
      }));
    }

    /* --- MADEN TAŞI ganimeti --- */
    if (tier === 'stone') {
      // taşın içinden çıkan efsunlu eşya: nadir efsun havuzundan 1-2 özellik
      out.items.push(this.generate({
        ilvl: U.clamp(player.level + U.randInt(0, 3), 1, 100), tier: gearTier,
        race: player.race, cls: player.cls, rarity: U.chance(0.25) ? 'epic' : 'rare',
        enchant: true, rareAffixes: U.chance(0.35) ? 2 : 1
      }));
      out.mats.maden = (out.mats.maden || 0) + U.randInt(2, 5);
      out.potions = { kucuk: U.randInt(2, 4) };
    }
    if (tier === 'boss') {
      // 1) Garantili boss hediyesi — daima efsunlu, bossa/canavara karşı statlı
      const gift = this.generate({
        ilvl: U.clamp(player.level + U.randInt(1, 3), 1, 100), tier: gearTier,
        race: player.race, cls: player.cls,
        rarity: U.chance(0.35) ? 'legendary' : 'epic', enchant: true, gift: true,
        rareAffixes: U.chance(0.4) ? 3 : 2      // hediyeler daima nadir efsunlu
      });
      // bossun elementine karşı dayanıklılık garantisi
      const bonusKey = monster.element === 'su' ? 'resSu' : 'resAtes';
      const aff = GameData.RARE_AFFIXES.find(a => a.key === bonusKey);
      gift.stats[bonusKey] = Math.round(((gift.stats[bonusKey] || 0) +
        (aff.base + aff.per * gift.ilvl) * 0.8) * 1000) / 1000;
      if (!gift.rareAffixes.includes(bonusKey)) gift.rareAffixes.push(bonusKey);
      gift.name = `${monster.name || 'Boss'} Hediyesi · ${gift.name}`;
      gift.price = Math.round(gift.price * 1.35);
      out.items.push(gift);

      // 2) Ek ganimet: efsunsuz olabilir (satılık / craft malzemesi)
      if (U.chance(0.65)) {
        out.items.push(this.generate({
          ilvl: U.clamp(player.level + U.randInt(0, 3), 1, 100), tier: gearTier,
          race: player.race, cls: player.cls, rarityBonus: 2.2, enchantChance: 0.45
        }));
      }
      // 3) İksir hediyesi
      out.potions = { kucuk: U.randInt(3, 6), buyuk: U.randInt(1, 2) };
    }

    // Materyal
    const addMat = (id, n) => { out.mats[id] = (out.mats[id] || 0) + n; };
    if (U.chance(0.45)) addMat('demir', U.randInt(1, 2));
    if (U.chance(0.35)) addMat('deri', U.randInt(1, 2));
    if (monster.element === 'su' && U.chance(0.30)) addMat('buzKristali', 1);
    if (monster.element === 'ates' && U.chance(0.30)) addMat('atesTasi', 1);
    if (tier === 'boss') {
      if (monster.element === 'su') addMat('krakenMuru', U.randInt(1, 2));
      else addMat('ejderPulu', U.randInt(1, 2));
      addMat('demir', U.randInt(4, 8));
    }
    return out;
  },

  /* Craft — tarif kontrolü ve üretim */
  canCraft(recipe, player) {
    if (player.gold < recipe.cost.gold) return 'Altın yetersiz';
    for (const [m, n] of Object.entries(recipe.mats)) {
      if ((player.mats[m] || 0) < n) return `${GameData.MATERIALS[m].name} yetersiz`;
    }
    return null;
  },

  craft(recipe, player) {
    player.gold -= recipe.cost.gold;
    for (const [m, n] of Object.entries(recipe.mats)) player.mats[m] -= n;
    return this.generate({
      ilvl: U.clamp(player.level + 2, 1, 100), tier: this.tierOf(player.level).id,
      slot: recipe.slot, rarity: recipe.rarity,
      race: player.race, cls: player.cls
    });
  }
};

/* ===== js/skills.js ===== */
/* =============================================================
   skills.js — Yetenek kullanımı (ırka göre element varyantı)
   ============================================================= */

const Skills = {

  listFor(cls) { return GameData.CLASSES[cls].skills.map(id => GameData.SKILLS[id]); },

  nameOf(skillId, race) { return GameData.SKILLS[skillId].name[race]; },

  /* Yeteneğin ırka göre yan etkisini normalize eder */
  effectFor(sk, race) {
    const raw = sk.effect ? sk.effect[race] : null;
    if (!raw) return null;
    const out = {};
    if (raw.slow) { out.slow = raw.slow; out.slowDur = raw.dur2 || raw.dur || 2; }
    if (raw.burn) { out.burn = raw.burn; out.burnDur = raw.dur || 3; }
    if (raw.stun) { out.stun = raw.stun; }
    return out;
  },

  /* ---- YETENEK SEVİYESİ ----
     Seviye arttıkça hasar artar, bekleme kısalır, yan etkiler güçlenir. */
  levelOf(actor, idx) {
    const max = GameData.SKILL_LEVEL.max;
    if (actor && actor.skillLv) return U.clamp(actor.skillLv[idx] || 1, 1, max);
    // botlar/yaratıklar: karakter leveline göre otomatik
    return U.clamp(1 + Math.floor((actor && actor.level || 1) / 9), 1, max);
  },

  /* Seviyeye göre ölçeklenmiş yetenek kopyası döner (orijinali bozmaz) */
  scaled(skillId, lv) {
    const sk = GameData.SKILLS[skillId];
    const L = GameData.SKILL_LEVEL;
    const n = U.clamp(lv || 1, 1, L.max) - 1;
    const out = Object.assign({}, sk);
    out.lv = n + 1;
    out.dmgBonus = L.damagePerLevel * n;
    if (sk.mult) out.mult = sk.mult * (1 + L.damagePerLevel * n);
    out.cd = Math.round(sk.cd * Math.max(L.cdFloor, 1 - L.cdPerLevel * n) * 10) / 10;
    out.mana = Math.round(sk.mana * (1 + L.manaPerLevel * n));
    const em = 1 + L.effectPerLevel * n;
    if (sk.effect) {
      out.effect = {};
      for (const r in sk.effect) {
        const c = Object.assign({}, sk.effect[r]);
        for (const k of ['slow', 'burn', 'dur', 'dur2']) if (c[k]) c[k] = Math.round(c[k] * em * 1000) / 1000;
        // sersemletme düz artar ve üst sınırı vardır (PvP'de kilitlenme olmasın)
        if (c.stun) c.stun = Math.min(L.stunCap, Math.round((c.stun + L.stunFlatPerLevel * n) * 100) / 100);
        out.effect[r] = c;
      }
    }
    if (sk.heal) { out.heal = {}; for (const r in sk.heal) out.heal[r] = sk.heal[r] * em; }
    if (sk.buff) {
      out.buff = {};
      for (const r in sk.buff) {
        const b = Object.assign({}, sk.buff[r]);
        for (const k in b) b[k] = Math.round(b[k] * em * 1000) / 1000;
        out.buff[r] = b;
      }
    }
    return out;
  },

  /* Yeteneğin ne işe yaradığını insan diliyle + sayılarla anlatır.
     stats verilirse tahmini hasar da hesaplanır. */
  info(skillId, race, cls, stats, lv = 1) {
    const base = GameData.SKILLS[skillId];
    if (!base) return null;
    const sk = this.scaled(skillId, lv);
    const magic = cls === 'buyucu';
    const power = stats ? (magic ? stats.magic : stats.attack) : 0;

    const TYPE = {
      melee:      { name: 'Yakın vuruş', how: 'Baktığın yöndeki dar alana tek sert vuruş yapar.' },
      area:       { name: 'Alan hasarı', how: sk.self ? 'Çevrende dönen bir alan açar.' : 'İmlecin olduğu bölgeye alan hasarı bırakır.' },
      projectile: { name: 'Mermi',       how: sk.count > 1 ? `${sk.count} mermiyi yelpaze şeklinde fırlatır.` : 'Baktığın yöne mermi fırlatır.' },
      dash:       { name: 'Atılma',      how: 'İleri fırlar, çarptığın düşmanı vurur.' },
      buff:       { name: 'Takviye',     how: 'Kendine süreli güçlendirme uygular.' }
    }[sk.type] || { name: sk.type, how: '' };

    const rows = [];
    if (sk.mult) {
      const per = sk.hits ? `${sk.hits} vuruş × %${Math.round(sk.mult * 100)}` : `%${Math.round(sk.mult * 100)}`;
      rows.push(['Hasar', `${magic ? 'Büyü gücünün' : 'Saldırının'} ${per}`]);
      if (power) {
        const total = power * sk.mult * (sk.hits || 1) * (sk.count || 1);
        rows.push(['Tahmini toplam', `~${U.fmt(Math.round(total))} (savunma öncesi)`]);
      }
    }
    rows.push(['Bekleme', sk.cd + ' sn']);
    rows.push(['Mana', sk.mana + '']);
    if (sk.radius) rows.push(['Etki alanı', sk.radius.toFixed(1) + ' birim']);
    if (sk.castRange) rows.push(['Atış menzili', sk.castRange.toFixed(1) + ' birim']);
    if (sk.dashDist) rows.push(['Atılma mesafesi', sk.dashDist.toFixed(1) + ' birim']);
    if (sk.pierce) rows.push(['Delme', `${sk.pierce} düşmanı delip geçer`]);
    if (sk.bonusPen) rows.push(['Ek delici', `savunmanın +%${Math.round(sk.bonusPen * 100)}'ini yok sayar`]);
    if (sk.forceCrit) rows.push(['Kritik', 'her zaman kritik vurur']);
    if (sk.splash) rows.push(['Patlama', `isabet yerinde ${sk.splash.toFixed(1)} birim patlar`]);
    if (sk.dur) rows.push(['Süre', sk.dur + ' sn']);

    // yan etkiler ırka göre
    const e = sk.effect ? sk.effect[race] : null;
    const eff = [];
    if (e) {
      if (e.slow) eff.push(`Yavaşlatır (−%${Math.round(e.slow * 100)} hız, ${e.dur2 || e.dur || 2} sn)`);
      if (e.burn) eff.push(`Yakar (saniyede saldırının %${Math.round(e.burn * 50)}'i, ${e.dur || 3} sn)`);
      if (e.stun) eff.push(`Sersemletir (${e.stun} sn)`);
    }
    if (sk.heal && sk.heal[race]) eff.push(`Seni max canının %${Math.round(sk.heal[race] * 100)}'i kadar iyileştirir`);
    if (sk.buff && sk.buff[race]) {
      for (const [k, v] of Object.entries(sk.buff[race])) {
        eff.push(`${U.statName(k)} ${k === 'hpRegen' ? '+' + v : '+%' + Math.round(v * 100)} (${sk.dur} sn)`);
      }
    }

    return {
      id: skillId,
      lv: sk.lv,
      name: sk.name[race],
      typeName: TYPE.name,
      how: TYPE.how,
      desc: sk.desc,
      rows, effects: eff,
      cd: sk.cd, mana: sk.mana
    };
  },

  /* actor: PlayerActor veya BotActor · idx: 0-3 · aim: {x,y} dünya koordinatı */
  cast(actor, idx, game, aim) {
    const race = actor.race;
    const cls = actor.cls;
    const skillId = GameData.CLASSES[cls].skills[idx];
    const sk = this.scaled(skillId, this.levelOf(actor, idx));
    const s = actor.eff();
    const magic = cls === 'buyucu';
    const colors = GameData.RACES[race].colors;
    const fx = Skills.effectFor(sk, race);
    const ang = U.angle(actor.x, actor.y, aim.x, aim.y);
    actor.facing = ang;

    switch (sk.type) {

      case 'melee': {
        game.meleeSwing(actor, {
          mult: sk.mult, radius: sk.radius, arc: sk.arc, magic, effect: fx, color: colors.aura
        });
        game.fx.arc(actor.x, actor.y, ang, sk.radius, colors.aura);
        break;
      }

      case 'projectile': {
        const n = sk.count || 1;
        for (let i = 0; i < n; i++) {
          const off = n === 1 ? 0 : (i - (n - 1) / 2) * (sk.spread || 0.3);
          game.spawnProjectile({
            owner: actor, x: actor.x, y: actor.y, angle: ang + off,
            speed: sk.speed, life: sk.life, mult: sk.mult, magic,
            color: colors.primary, size: 0.24, pierce: sk.pierce || 0,
            splash: sk.splash || 0, bonusPen: sk.bonusPen || 0,
            forceCrit: !!sk.forceCrit, effect: fx
          });
        }
        break;
      }

      case 'area': {
        let cx = aim.x, cy = aim.y;
        if (sk.self) { cx = actor.x; cy = actor.y; }
        else if (sk.castRange) {
          const d = U.dist(actor.x, actor.y, aim.x, aim.y);
          if (d > sk.castRange) {
            cx = actor.x + Math.cos(ang) * sk.castRange;
            cy = actor.y + Math.sin(ang) * sk.castRange;
          }
        }
        game.spawnArea({
          owner: actor, x: cx, y: cy, radius: sk.radius, hits: sk.hits || 1,
          tick: sk.tick || 0.4, mult: sk.mult, magic, color: colors.primary,
          effect: fx, follow: sk.self ? actor : null
        });
        if (sk.heal && sk.heal[race]) {
          const heal = actor.maxHp * sk.heal[race];
          actor.hp = Math.min(actor.maxHp, actor.hp + heal);
          game.fx.damageNumber(actor.x, actor.y, Math.round(heal), { heal: true });
        }
        break;
      }

      case 'dash': {
        const dist = sk.dashDist;
        const tx = actor.x + Math.cos(ang) * dist;
        const ty = actor.y + Math.sin(ang) * dist;
        if (!game.world.blocked(tx, ty, actor.r)) { actor.x = tx; actor.y = ty; }
        game.world.clampPos(actor);
        game.fx.trail(actor.x, actor.y, colors.aura);
        game.meleeSwing(actor, {
          mult: sk.mult, radius: sk.radius + 1, arc: Math.PI * 2, magic, effect: fx, color: colors.aura
        });
        break;
      }

      case 'buff': {
        const mods = sk.buff[race];
        actor.addEffect({ type: 'buff', dur: sk.dur, mods, color: colors.aura });
        game.fx.ring(actor.x, actor.y, colors.aura, 2.2);
        break;
      }
    }
  },

  /* Oyuncu için kullanım denetimi */
  tryCast(player, idx, game, aim) {
    if (player.dead || player.stunned || player.busy > 0.15) return false;
    const skillId = GameData.CLASSES[player.cls].skills[idx];
    const sk = this.scaled(skillId, this.levelOf(player, idx));
    // kilitli yetenek
    const need = GameData.SKILL_LEVEL.unlockAt[idx] || 1;
    if ((player.level || 1) < need) { UI.toast(`Bu yetenek Level ${need}'te açılır`, 'warn'); return false; }
    if (player.skillCd[idx] > 0) return false;
    if (player.mana < sk.mana) { UI.toast('Enerji yetersiz', 'warn'); return false; }
    player.mana -= sk.mana;
    player.skillCd[idx] = sk.cd;
    player.busy = 0.3;
    Skills.cast(player, idx, game, aim);
    return true;
  }
};
